<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initiative — Player View</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Alias theme.css token names to this page's existing palette so any theme component classes inherit the local look. */
:root {
  --c-bg: var(--bg); --c-bg-elevated: var(--surface); --c-surface: var(--surface);
  --c-surface-2: var(--surface2); --c-surface-3: var(--surface2);
  --c-border: var(--border); --c-border-light: var(--border-light);
  --c-brass: var(--gold); --c-brass-bright: var(--gold-light); --c-brass-deep: var(--gold-faint);
  --c-teal: var(--lobby-accent, #4a9595); --c-teal-bright: #7ec5c5; --c-teal-deep: var(--lobby-bg, #2a5454);
  --c-ink: var(--ink); --c-ink-light: var(--ink-dim); --c-ink-faint: var(--ink-faint); --c-ink-dim: var(--ink-faint);
  --c-error: var(--red); --c-success: var(--green-light);
}
:root {
  --bg: #0e0c06;
  --surface: #1a1608;
  --surface2: #221d0a;
  --border: #332a0e;
  --border-light: #443a18;
  --gold: #b8860b;
  --gold-light: #d4a820;
  --gold-faint: #5a4208;
  --ink: #e8dfc0;
  --ink-dim: #a09070;
  --ink-faint: #6a5a40;
  --red: #c0392b;
  --red-bg: #2a0f0d;
  --green: #2d6a3f;
  --green-light: #4a9a60;
  --pc-accent: #2e5a8a;
  --enemy-accent: #8a2e2e;
  --active-glow: rgba(184,134,11,0.3);
  --lobby-accent: #3a6060;
  --lobby-bg: #0d1e1e;
  --radius: 4px;
}

body {
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 0%, rgba(184,134,11,0.07) 0%, transparent 55%);
  color: var(--ink);
  font-family: 'Crimson Text', Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(1rem, 2vw + 0.5rem, 1.5rem);
}

/* ── Header ── */
.header {
  width: 100%;
  max-width: 640px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 1rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--border);
}
@media (max-width: 480px) {
  .header h1 { font-size: 0.95rem; letter-spacing: 0.12em; }
  .round-badge { font-size: 0.66rem; padding: 4px 11px; }
}
.header h1 { font-family: 'Cinzel', serif; font-size: clamp(1rem,0.9rem + 0.5vw,1.2rem); font-weight: 600; letter-spacing: 0.16em; color: var(--gold-light); text-transform: uppercase; text-shadow: 0 1px 12px rgba(184,134,11,0.10); }
.round-badge { font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--ink-dim); background: var(--surface); border: 1px solid var(--border-light); border-radius: 9999px; padding: 5px 14px; text-transform: uppercase; }
.round-badge span { color: var(--gold-light); font-size: 1.05rem; font-weight: 600; margin-left: 5px; }

/* ── Connection bar ── */
.conn-bar { width: 100%; max-width: 640px; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.1em; text-align: center; margin-bottom: 0.8rem; padding: 4px; border-radius: var(--radius); }
.conn-bar.live    { color: #4a9a60; background: rgba(74,154,96,0.1);  border: 1px solid rgba(74,154,96,0.3); }
.conn-bar.waiting { color: var(--ink-faint); background: var(--surface); border: 1px solid var(--border); }
.conn-bar.error   { color: #e88; background: var(--red-bg); border: 1px solid var(--red); }

/* ── Lobby screen ── */
.lobby-screen {
  width: 100%;
  max-width: 640px;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
}
.lobby-screen.show { display: flex; }
.lobby-icon { font-size: 3rem; margin-bottom: 1.2rem; opacity: 0.6; animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:0.8;transform:scale(1.04)} }
.lobby-title { font-family: 'Cinzel', serif; font-size: 1.3rem; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 0.6rem; }
.lobby-sub { font-size: 1rem; color: var(--ink-faint); font-style: italic; }
.lobby-dots span {
  display: inline-block;
  animation: dot 1.4s ease-in-out infinite;
  color: var(--gold-faint);
  font-size: 1.4rem;
  line-height: 1;
  margin: 0 1px;
}
.lobby-dots span:nth-child(2) { animation-delay: 0.2s; }
.lobby-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,80%,100%{opacity:0.2;transform:translateY(0)} 40%{opacity:1;transform:translateY(-4px)} }

/* ── Combat view ── */
.combat-view { width: 100%; max-width: 640px; display: none; }
.combat-view.show { display: block; }

/* ── Active banner ── */
.active-banner {
  width: 100%;
  background: linear-gradient(90deg,rgba(184,134,11,0.22) 0%,transparent 100%);
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 10px 18px;
  margin-bottom: 1rem;
  font-family: 'Cinzel', serif; font-size: 0.82rem; font-weight: 500; letter-spacing: 0.12em;
  color: var(--gold-light); display: none;
  text-transform: uppercase;
  box-shadow: 0 0 18px rgba(184,134,11,0.12);
}
.active-banner.show { display: block; }

/* ── Rows ── */
.row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 8px;
  transition: border-color 200ms cubic-bezier(0.16,1,0.3,1),
              box-shadow 200ms cubic-bezier(0.16,1,0.3,1),
              background 200ms cubic-bezier(0.16,1,0.3,1),
              transform 200ms cubic-bezier(0.16,1,0.3,1),
              opacity 200ms cubic-bezier(0.16,1,0.3,1);
  overflow: hidden;
}
.row.is-pc    { border-left: 3px solid var(--pc-accent); }
.row.is-enemy { border-left: 3px solid var(--enemy-accent); }
.row.is-active {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(184,134,11,0.25), 0 0 18px var(--active-glow), 0 2px 8px rgba(0,0,0,0.30);
  background: var(--surface2);
  transform: translateX(2px);
}
.row.is-dead  { opacity: 0.38; }

.row-main { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; }
.init-num { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 600; color: var(--gold-light); text-align: center; }
.row.is-active .init-num { color: var(--gold); }

.name-text { font-family: 'Cinzel', serif; font-size: 0.92rem; letter-spacing: 0.03em; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.active-marker { color: var(--gold); font-size: 0.85rem; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.type-pip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.type-pip.pc    { background: var(--pc-accent); }
.type-pip.enemy { background: var(--enemy-accent); }

.conds { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.cond-tag { font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.05em; padding: 1px 6px; border-radius: 8px; background: rgba(200,120,0,0.15); color: #d4a820; border: 1px solid rgba(200,120,0,0.35); }

.hp-block { text-align: right; min-width: 110px; }
.hp-label { font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 3px; }
.hp-bar-wrap { width: 100%; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
.hp-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s ease; }
.hp-num { font-size: 0.78rem; color: var(--ink-dim); margin-top: 2px; }

.ac-chip { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--ink-dim); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 2px 8px; text-align: center; margin-left: 8px; white-space: nowrap; }
.ac-chip small { display: block; font-size: 0.55rem; color: var(--ink-faint); }

.right-col { display: flex; align-items: center; }

/* ── Player notes preview (on collapsed row) ── */
.notes-preview {
  display: flex; align-items: center; gap: 6px;
  margin-top: 5px;
  font-size: 0.78rem;
  color: var(--ink-dim);
  font-style: italic;
  /* truncate to one line */
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.notes-preview .pn-icon {
  color: var(--gold-light); font-style: normal;
  font-size: 0.85rem;
}
.notes-preview .pn-count {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--gold-faint);
  padding: 0 4px;
  border-radius: 8px;
  background: rgba(184,134,11,0.10);
  border: 1px solid rgba(184,134,11,0.25);
  font-style: normal;
}
.notes-preview .pn-author {
  color: var(--ink-faint);
}

/* ── Expanded row (notes panel) ── */
.row-expanded {
  display: none;
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.18);
}
.row.expanded .row-expanded { display: block; }
.row.expanded { cursor: default; }
.row:not(.expanded) { cursor: pointer; }

.notes-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.note-card {
  background: var(--surface2);
  border: 1px solid var(--border-light);
  border-left: 2px solid var(--gold-faint);
  border-radius: 3px;
  padding: 7px 10px;
  position: relative;
}
.note-card.is-mine { border-left-color: var(--pc-accent); }
.note-card.is-pending { opacity: 0.55; }
.note-body {
  color: var(--ink);
  font-size: 0.86rem;
  word-break: break-word;
  white-space: pre-wrap;
}
.note-meta {
  margin-top: 3px;
  display: flex; align-items: center; gap: 8px;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.note-meta .vis-chip {
  padding: 1px 6px; border-radius: 8px;
  border: 1px solid var(--border-light);
}
.note-meta .vis-chip.party   { color: var(--gold-light);  border-color: var(--gold-faint); }
.note-meta .vis-chip.private { color: #95d0d0; border-color: var(--lobby-accent); }
.note-meta .delete-btn {
  margin-left: auto;
  background: none; border: 0; color: var(--ink-faint);
  cursor: pointer; font-size: 0.9rem; padding: 0 4px;
}
.note-meta .delete-btn:hover { color: var(--red); }
.notes-empty {
  color: var(--ink-faint); font-style: italic; font-size: 0.8rem;
  padding: 4px 0;
}

.add-note-form {
  display: flex; flex-direction: column; gap: 6px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-light);
}
.add-note-form textarea {
  width: 100%;
  min-height: 50px;
  resize: vertical;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--border-light);
  border-radius: 3px;
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 0.88rem;
  padding: 6px 8px;
}
.add-note-form textarea:focus { outline: none; border-color: var(--gold); }
.add-note-form .row-actions {
  display: flex; align-items: center; gap: 12px;
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em;
  color: var(--ink-dim);
}
.add-note-form .vis-toggle { display: flex; gap: 10px; }
.add-note-form label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.add-note-form input[type=radio] { accent-color: var(--gold); }
.add-note-form button {
  margin-left: auto;
  padding: 5px 14px;
  background: var(--gold-faint);
  color: var(--ink);
  border: 1px solid var(--gold);
  border-radius: 3px;
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  cursor: pointer;
}
.add-note-form button:hover { background: var(--gold); color: #1a1408; }
.add-note-form button:disabled { opacity: 0.4; cursor: not-allowed; }
.add-note-form .char-counter {
  font-size: 0.65rem; color: var(--ink-faint);
}
.add-note-form .char-counter.warn { color: var(--amber); }
.add-note-form .char-counter.over { color: var(--red); }
.add-note-form .form-error {
  color: var(--red); font-size: 0.78rem; font-style: italic;
  font-family: 'Crimson Text', serif;
}
.login-banner {
  padding: 8px 10px;
  background: rgba(58,96,96,0.18);
  border: 1px solid var(--lobby-accent);
  border-radius: 3px;
  color: var(--ink-dim);
  font-size: 0.82rem;
  font-style: italic;
  display: flex; align-items: center; gap: 10px;
}
.login-banner a {
  color: var(--gold-light);
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  padding: 3px 10px;
  border: 1px solid var(--gold-faint);
  border-radius: 3px;
}
.login-banner a:hover { background: var(--gold-faint); color: var(--ink); }
</style>
</head>
<body>
<main id="main" aria-label="Live initiative order" style="width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center">

<div class="header">
  <h1>⚔ Initiative Order</h1>
  <div class="round-badge">ROUND <span id="round-num">—</span></div>
  <a href="home.html" style="margin-left:auto;color:inherit;text-decoration:none;font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.1em;opacity:0.7" title="Back to hub">⌂ HOME</a>
</div>

<div class="conn-bar waiting" id="conn-bar">⟳ Connecting…</div>

<!-- LOBBY SCREEN -->
<div class="lobby-screen" id="lobby-screen">
  <div class="lobby-icon">⚔</div>
  <div class="lobby-title">Combat incoming</div>
  <div class="lobby-sub">Your DM is preparing the encounter…</div>
  <div class="lobby-dots" style="margin-top:1.2rem">
    <span>●</span><span>●</span><span>●</span>
  </div>
</div>

<!-- COMBAT VIEW -->
<div class="combat-view" id="combat-view">
  <div class="active-banner" id="active-banner"></div>
  <div id="list"></div>
</div>

</main>

<script src="auth.js"></script>
<script src="initiative-notes.js"></script>
<script>
const WORKER_URL = (window.Auth && window.Auth.WORKER_URL) || 'https://dnd-perk-webhook.jacobgiff.workers.dev/';
const POLL_MS    = 2500;

let lastMode = null;
let failCount = 0;
let expandedId = null;   // combatant.id currently expanded, or null

// Bind click to expand/collapse. Called from row creation in renderRow().
function bindRowClick(rowEl, combatantId) {
  rowEl.addEventListener('click', (e) => {
    // Ignore clicks inside the expanded area (form inputs, delete buttons)
    if (e.target.closest('.row-expanded')) return;
    expandedId = (expandedId === combatantId) ? null : combatantId;
    renderExpandedState();
  });
}

function renderExpandedState() {
  document.querySelectorAll('.row').forEach(r => {
    const id = r.dataset.combatantId;
    r.classList.toggle('expanded', id === expandedId);
  });
}

function renderNotesList(combatantId, notes, viewer) {
  // viewer = { role: 'player'|'anonymous', characterId? } (no DM here)
  const root = document.querySelector(`.row-expanded[data-combatant-id="${CSS.escape(combatantId)}"] .notes-list`);
  if (!root) return;
  root.innerHTML = '';
  if (!notes || notes.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'notes-empty';
    empty.textContent = 'No notes yet.';
    root.appendChild(empty);
    return;
  }
  const sorted = notes.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  sorted.forEach(n => {
    const card = document.createElement('div');
    card.className = 'note-card' + (viewer.characterId && n.authorCharId === viewer.characterId ? ' is-mine' : '');
    if (n._pending) card.classList.add('is-pending');

    const body = document.createElement('div');
    body.className = 'note-body';
    body.textContent = n.body;   // textContent, never innerHTML
    card.appendChild(body);

    const meta = document.createElement('div');
    meta.className = 'note-meta';
    const vis = document.createElement('span');
    vis.className = 'vis-chip ' + n.visibility;
    vis.textContent = n.visibility;
    meta.appendChild(vis);
    const author = document.createElement('span');
    const isMine = viewer.characterId && n.authorCharId === viewer.characterId;
    author.textContent = (isMine ? 'you' : (n.authorName || '?')) + ' · ' + relTime(n.createdAt);
    meta.appendChild(author);

    if (InitiativeNotes.canDeleteNote(n,
        { role: 'player', characterId: viewer.characterId })) {
      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.title = 'Delete this note';
      del.onclick = (e) => { e.stopPropagation(); deleteNote(combatantId, n.id); };
      meta.appendChild(del);
    }

    card.appendChild(meta);
    root.appendChild(card);
  });

  // Add-note form (only for logged-in players)
  if (viewer.characterId) {
    const form = document.createElement('div');
    form.className = 'add-note-form';
    const lastVis = localStorage.getItem('spire-initiative-note-vis') || 'party';
    form.innerHTML = `
      <textarea placeholder="Add a note about ${escapeAttr(getCombatantName(combatantId))}…"
                maxlength="${InitiativeNotes.MAX_NOTE_LENGTH + 50 /* allow overflow for counter */}"></textarea>
      <div class="row-actions">
        <div class="vis-toggle">
          <label><input type="radio" name="vis-${CSS.escape(combatantId)}" value="private" ${lastVis === 'private' ? 'checked' : ''}>JUST ME</label>
          <label><input type="radio" name="vis-${CSS.escape(combatantId)}" value="party"   ${lastVis === 'party'   ? 'checked' : ''}>PARTY</label>
        </div>
        <span class="char-counter">0/${InitiativeNotes.MAX_NOTE_LENGTH}</span>
        <button class="save-btn" disabled>Save</button>
      </div>
      <div class="form-error" style="display:none"></div>
    `;
    const textarea = form.querySelector('textarea');
    const counter  = form.querySelector('.char-counter');
    const saveBtn  = form.querySelector('.save-btn');
    const errEl    = form.querySelector('.form-error');

    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      counter.textContent = len + '/' + InitiativeNotes.MAX_NOTE_LENGTH;
      counter.classList.toggle('warn', len > 400 && len <= InitiativeNotes.MAX_NOTE_LENGTH);
      counter.classList.toggle('over', len > InitiativeNotes.MAX_NOTE_LENGTH);
      saveBtn.disabled = (textarea.value.trim().length === 0) || len > InitiativeNotes.MAX_NOTE_LENGTH;
    });

    saveBtn.addEventListener('click', () => {
      const vis = form.querySelector('input[type=radio]:checked').value;
      localStorage.setItem('spire-initiative-note-vis', vis);
      submitNote(combatantId, textarea.value, vis, { textarea, errEl, saveBtn });
    });

    root.parentElement.appendChild(form);  // appended outside .notes-list (sibling)
  }
}

function escapeAttr(s) {
  return String(s || '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function getCombatantName(id) {
  // Look up the latest snapshot's combatants. lastSnapshot stored in poll().
  const c = (lastSnapshot && lastSnapshot.combatants || []).find(x => x.id === id);
  return c ? c.name : 'this combatant';
}

let lastSnapshot = null;

function relTime(ms) {
  if (!ms) return '';
  const diff = Date.now() - ms;
  if (diff < 60_000)         return 'just now';
  if (diff < 3_600_000)      return Math.floor(diff / 60_000) + 'm ago';
  if (diff < 86_400_000)     return Math.floor(diff / 3_600_000) + 'h ago';
  const d = new Date(ms);
  return d.toLocaleDateString();
}

function deleteNote(combatantId, noteId) {
  // Implemented in Task 18.
  console.log('TODO delete', combatantId, noteId);
}

function submitNote(/* impl in Task 17 */) {}

function hpColor(pct) {
  return pct > 60 ? '#2d6a3f' : pct > 30 ? '#c87800' : '#c0392b';
}
function hpLabel(pct, type, hp, maxHp) {
  if (type === 'pc' && hp !== null) return `${hp} / ${maxHp}`;
  if (pct >= 100) return 'Unharmed';
  if (pct >= 75)  return 'Lightly wounded';
  if (pct >= 50)  return 'Wounded';
  if (pct >= 25)  return 'Heavily wounded';
  if (pct > 0)    return 'Near death';
  return 'Unconscious';
}

function showLobby() {
  document.getElementById('lobby-screen').classList.add('show');
  document.getElementById('combat-view').classList.remove('show');
  document.getElementById('active-banner').classList.remove('show');
  document.getElementById('round-num').textContent = '—';
}

function showCombat(s) {
  document.getElementById('lobby-screen').classList.remove('show');
  document.getElementById('combat-view').classList.add('show');
  document.getElementById('round-num').textContent = s.round;

  const list   = document.getElementById('list');
  const banner = document.getElementById('active-banner');

  if (!s.combatants || s.combatants.length === 0) {
    list.innerHTML = '';
    banner.classList.remove('show');
    return;
  }

  const active = s.combatants[s.activeIndex];
  if (active) {
    banner.textContent = `▶ It is ${active.name}'s turn`;
    banner.classList.add('show');
  }

  list.innerHTML = '';
  s.combatants.forEach((c, idx) => {
    const isActive = idx === s.activeIndex;
    const isPC     = c.type === 'pc';
    const hpPct    = c.hpPct ?? 100;

    const row = document.createElement('div');
    row.className = `row is-${c.type}${isActive ? ' is-active' : ''}${c.dead ? ' is-dead' : ''}`;

    const condsHtml = c.conditions && c.conditions.length > 0
      ? `<div class="conds">${c.conditions.map(cond => `<span class="cond-tag">${cond}</span>`).join('')}</div>`
      : '';

    // AC: only shown for PCs (enemies have ac:null in payload)
    const acHtml = (isPC && c.ac)
      ? `<div class="ac-chip"><small>AC</small>${c.ac}</div>`
      : '';

    row.innerHTML = `
      <div class="row-main">
        <div class="init-num">${c.init}</div>
        <div>
          <div class="name-text">
            <span class="type-pip ${c.type}"></span>
            ${isActive ? '<span class="active-marker">▶</span>' : ''}
            ${c.name}
          </div>
          ${condsHtml}
        </div>
        <div class="right-col">
          <div class="hp-block">
            <div class="hp-label">${isPC ? 'HP' : 'CONDITION'}</div>
            <div class="hp-bar-wrap">
              <div class="hp-bar" style="width:${hpPct}%;background:${hpColor(hpPct)}"></div>
            </div>
            <div class="hp-num">${hpLabel(hpPct, c.type, c.hp, c.maxHp)}</div>
          </div>
          ${acHtml}
        </div>
      </div>
      <div class="row-expanded" data-combatant-id="${c.id}">
        <div class="notes-list"></div>
      </div>
    `;

    // ── Notes preview (one-line, newest visible note) ─────────────
    const notes = Array.isArray(c.playerNotes) ? c.playerNotes : [];
    if (notes.length > 0) {
      // Newest first by createdAt
      const sorted = notes.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      const top = sorted[0];
      const previewEl = document.createElement('div');
      previewEl.className = 'notes-preview';
      // Build the preview using textContent so note bodies can't inject HTML
      const icon = document.createElement('span'); icon.className = 'pn-icon'; icon.textContent = '📝';
      const count = document.createElement('span'); count.className = 'pn-count';
      count.textContent = '×' + notes.length;
      const body = document.createElement('span');
      const truncated = top.body.length > 60 ? top.body.slice(0, 57) + '…' : top.body;
      body.textContent = '"' + truncated + '"';
      const author = document.createElement('span');
      author.className = 'pn-author';
      author.textContent = '— ' + (top.authorName || '?');
      previewEl.appendChild(icon);
      previewEl.appendChild(count);
      previewEl.appendChild(body);
      previewEl.appendChild(author);
      // Append into the row-main's middle column (the name area)
      const middleCol = row.querySelector('.row-main > div:nth-child(2)');
      if (middleCol) middleCol.appendChild(previewEl);
    }

    list.appendChild(row);

    row.dataset.combatantId = c.id;
    bindRowClick(row, c.id);

    const me = (window.Auth && Auth.playerCreds && Auth.playerCreds()) || null;
    const viewer = { role: 'player', characterId: me ? me.characterId : null };
    renderNotesList(c.id, c.playerNotes || [], viewer);
  });

  renderExpandedState();
}

function buildStateUrl() {
  // Auth.playerCreds() returns { characterId, code, name } for logged-in players,
  // or null if anonymous/DM. (Defined in auth.js around line 138.)
  const me = (window.Auth && Auth.playerCreds && Auth.playerCreds()) || null;
  let url = WORKER_URL + '?type=initiative_state';
  if (me && me.characterId && me.code) {
    url += '&characterId=' + encodeURIComponent(me.characterId)
        +  '&code='        + encodeURIComponent(me.code);
  }
  return url;
}

async function poll() {
  try {
    const res  = await fetch(buildStateUrl(), { cache: 'no-store' });
    if (!res.ok) {
      // 401 means our player creds were rotated — fall back to anonymous next tick.
      // Auth.logout() clears the whole spire-auth blob; since localStorage holds
      // one role at a time, this is equivalent to clearing player creds when
      // role === 'player'.
      if (res.status === 401 && window.Auth && Auth.logout) Auth.logout();
      throw new Error(res.status);
    }
    const data = await res.json();
    failCount  = 0;

    const bar = document.getElementById('conn-bar');
    bar.className   = 'conn-bar live';
    bar.textContent = '✦ Live — updates every few seconds';

    if (data && typeof data.mode !== 'undefined') {
      lastSnapshot = data;
      if (data.mode === 'lobby') {
        showLobby();
      } else {
        showCombat(data);
      }
      lastMode = data.mode;
    }
  } catch {
    failCount++;
    const bar = document.getElementById('conn-bar');
    if (failCount > 3) {
      bar.className   = 'conn-bar error';
      bar.textContent = '⚠ Connection lost — retrying…';
    }
  }
  setTimeout(poll, POLL_MS);
}

poll();
</script>
</body>
</html>
