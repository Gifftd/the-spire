<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Spire — Chronicle</title>
  <meta name="theme-color" content="#060a0e">
  <meta name="description" content="The Chronicle — every session, event, and milestone in the campaign.">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* ──────────────────────────────────────────────────────────
       Page-specific styles (timeline.html — the Chronicle).
       Shared tokens & components live in theme.css.
       ────────────────────────────────────────────────────────── */

    body {
      padding: clamp(1rem, 2vw + 0.5rem, 2rem) 1rem 4rem;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(74,149,149,0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 95%, rgba(184,138,90,0.07) 0%, transparent 55%);
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      animation: hero-rise 320ms var(--ease-out) both;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding-bottom: var(--space-4);
      margin-bottom: var(--space-3);
      border-bottom: 1px solid var(--c-border);
      flex-wrap: wrap;
    }
    .topbar h1 {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-ink);
      line-height: 1;
    }
    .topbar h1 .accent {
      color: var(--c-teal-bright);
      font-weight: 400;
    }
    .topbar-meta {
      display: flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-ink-faint);
      flex-wrap: wrap;
    }
    .topbar-meta strong { color: var(--c-ink); font-weight: 600; }

    /* ── Hero strip below topbar ── */
    .hero-strip {
      margin-bottom: var(--space-5);
      padding-bottom: var(--space-4);
      border-bottom: 1px dashed var(--c-border);
    }
    .hero-strip-tag {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--c-teal-bright);
      opacity: 0.7;
      margin-bottom: var(--space-1);
    }
    .hero-strip-subtitle {
      font-family: var(--font-body);
      font-style: italic;
      font-size: var(--text-base);
      color: var(--c-ink-light);
      line-height: 1.5;
    }

    /* ── Filter bar ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      align-items: center;
    }
    .filters .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .filters .search-wrap input {
      width: 100%;
      background: var(--c-bg-elevated);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      color: var(--c-ink);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      padding: 7px 11px 7px 34px;
      outline: none;
      transition: border-color var(--motion-fast) var(--ease-out),
                  box-shadow var(--motion-fast) var(--ease-out);
    }
    .filters .search-wrap input:focus {
      border-color: var(--c-teal);
      box-shadow: 0 0 0 3px rgba(74,149,149,0.16);
    }
    .filters .search-wrap::before {
      content: '';
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      background: currentColor;
      color: var(--c-ink-faint);
      -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.5' y2='16.5'/></svg>") no-repeat center / contain;
              mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.5' y2='16.5'/></svg>") no-repeat center / contain;
      pointer-events: none;
    }
    .filters select {
      background: var(--c-bg-elevated);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      color: var(--c-ink);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      padding: 7px 11px;
      outline: none;
      cursor: pointer;
      transition: border-color var(--motion-fast) var(--ease-out);
    }
    .filters select:focus { border-color: var(--c-teal); }
    .filters-count {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.12em;
      color: var(--c-ink-faint);
      margin-left: auto;
      white-space: nowrap;
    }
    .filters-count strong { color: var(--c-ink); font-weight: 600; }

    /* ── Empty / loading / error states ── */
    .state {
      text-align: center;
      padding: var(--space-7) var(--space-3);
      color: var(--c-ink-faint);
      font-style: italic;
      font-size: var(--text-base);
      animation: pane-fade 220ms var(--ease-out);
    }
    .state.error { color: var(--c-error); }
    .state-icon {
      display: block;
      margin: 0 auto var(--space-3);
      width: 38px; height: 38px;
      color: var(--c-ink-dim);
      opacity: 0.7;
    }

    /* ── Timeline entries ── */
    #entries { display: flex; flex-direction: column; gap: var(--space-3); }

    .entry {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      border-left: 3px solid var(--c-border-light);
      box-shadow: var(--shadow-1);
      transition: border-color var(--motion-fast) var(--ease-out),
                  box-shadow var(--motion-base) var(--ease-out),
                  transform var(--motion-fast) var(--ease-out);
      animation: card-rise 360ms var(--ease-out) both;
      animation-delay: calc(var(--entry-i, 0) * 35ms);
    }
    .entry:hover { border-color: var(--c-border-light); box-shadow: var(--shadow-2); }

    .entry.kind-session   { border-left-color: #4a90d4; }
    .entry.kind-event     { border-left-color: #c87800; }
    .entry.kind-milestone { border-left-color: var(--c-teal-bright); }
    .entry.kind-planned   {
      border-left-color: var(--c-brass);
      background: linear-gradient(90deg, rgba(184,138,90,0.06), var(--c-surface));
    }
    .entry.expanded { border-color: var(--c-border-light); box-shadow: var(--shadow-2); }
    .entry.expanded.kind-session   { border-color: rgba(74,144,212,0.45); }
    .entry.expanded.kind-event     { border-color: rgba(200,120,0,0.45); }
    .entry.expanded.kind-milestone { border-color: rgba(126,197,197,0.45); }
    .entry.expanded.kind-planned   { border-color: rgba(184,138,90,0.45); }

    /* Hide body / combats / loot / dmnotes / chips when collapsed */
    .entry:not(.expanded) .entry-body,
    .entry:not(.expanded) .entry-combat,
    .entry:not(.expanded) .entry-loot,
    .entry:not(.expanded) .entry-dmnotes,
    .entry:not(.expanded) .entry-meta { display: none; }

    .entry-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2) var(--space-3);
      cursor: pointer;
      user-select: none;
      outline: none;
      border-radius: var(--radius-sm);
    }
    .entry-head:focus-visible {
      outline: 2px solid var(--c-teal-bright);
      outline-offset: 4px;
    }
    .entry.expanded .entry-head { margin-bottom: var(--space-3); }

    .entry-kind {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      border: 1px solid;
    }
    .entry-kind.session   { color: #8fbceb; border-color: #4a80c0; background: rgba(74,144,212,0.08); }
    .entry-kind.event     { color: #f0b076; border-color: #c87800; background: rgba(200,120,0,0.08); }
    .entry-kind.milestone { color: var(--c-teal-bright); border-color: var(--c-teal); background: rgba(74,149,149,0.10); }
    .entry-kind.planned   { color: var(--c-brass); border-color: rgba(184,138,90,0.55); background: rgba(184,138,90,0.08); }

    .entry-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--c-ink);
      flex: 1;
      line-height: 1.3;
      min-width: 0;
    }

    .entry-dates {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-left: auto;
    }
    .entry-date {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.10em;
      color: var(--c-teal);
    }
    .entry-date.real {
      color: var(--c-ink-faint);
      font-size: var(--text-2xs);
    }
    .entry-date.real::before {
      content: '·\00a0';
      color: var(--c-border-light);
      margin-right: 2px;
    }

    .entry-toggle {
      font-family: var(--font-display);
      font-size: 0.95rem;
      line-height: 1;
      color: var(--c-teal);
      width: 18px;
      text-align: center;
      transition: transform var(--motion-base) var(--ease-out),
                  color var(--motion-fast) var(--ease-out);
      flex-shrink: 0;
    }
    .entry.expanded .entry-toggle {
      transform: rotate(90deg);
      color: var(--c-teal-bright);
    }

    /* Tag chips — below the title row, visible in both states */
    .entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: var(--space-2); }
    .entry-tag {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.08em;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      background: rgba(184,138,90,0.10);
      border: 1px solid rgba(184,138,90,0.35);
      color: var(--c-brass);
    }

    .entry-body {
      font-size: var(--text-base);
      line-height: 1.72;
      color: var(--c-ink-light);
      white-space: pre-wrap;
      margin-top: var(--space-1);
      padding-top: var(--space-2);
      border-top: 1px solid var(--c-border);
    }

    /* Combats + loot on a session entry */
    .entry-combat {
      background: var(--c-bg-elevated);
      border: 1px solid var(--c-border);
      border-left: 3px solid #4a90d4;
      border-radius: var(--radius-sm);
      padding: var(--space-3) var(--space-3);
      margin-top: var(--space-3);
    }
    .entry-combat-head {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      letter-spacing: 0.04em;
      color: var(--c-ink);
      margin-bottom: var(--space-1);
    }
    .entry-combat-head .outcome { color: var(--c-teal-bright); }
    .entry-combat-line {
      font-size: var(--text-sm);
      color: var(--c-ink-light);
      line-height: 1.55;
    }
    .entry-combat-line .lbl { color: var(--c-ink-faint); font-family: var(--font-display); font-size: var(--text-2xs); letter-spacing: 0.10em; text-transform: uppercase; }
    .entry-combat-detail { margin-top: var(--space-2); }
    .entry-combat-detail summary {
      cursor: pointer;
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-brass);
      list-style: none;
    }
    .entry-combat-detail summary::before { content: '▸\00a0'; transition: transform var(--motion-fast); display: inline-block; }
    .entry-combat-detail[open] summary::before { transform: rotate(90deg); }
    .entry-combat-detail pre {
      margin-top: var(--space-2);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      font-size: var(--text-sm);
      line-height: 1.5;
      color: var(--c-ink-light);
      white-space: pre-wrap;
      overflow-x: auto;
      font-family: var(--font-mono);
    }

    .entry-loot { margin-top: var(--space-3); }
    .entry-loot-title {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-brass);
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .entry-loot-title::before { content: '◆'; }
    .loot-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }
    .loot-table th {
      text-align: left;
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-ink-faint);
      padding: 3px 8px;
      border-bottom: 1px solid var(--c-border);
      font-weight: 500;
    }
    .loot-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--c-border);
      color: var(--c-ink-light);
    }
    .loot-table tr:last-child td { border-bottom: none; }
    .loot-table td.qty { width: 48px; color: var(--c-teal-bright); font-family: var(--font-display); }
    .loot-table td.who { width: 130px; color: var(--c-ink-faint); }

    /* DM-only notes panel */
    .entry-dmnotes {
      background: rgba(184,138,90,0.08);
      border: 1px solid rgba(184,138,90,0.40);
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      margin-top: var(--space-3);
      font-size: var(--text-sm);
      line-height: 1.55;
      color: var(--c-brass-bright);
    }
    .entry-dmnotes-label {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: var(--space-1);
      opacity: 0.85;
    }
    .entry-dmnotes-label::before { content: '🔒 '; }

    /* Linked location/character/NPC chips */
    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--c-border);
    }
    .entry-chip {
      background: var(--c-surface-2);
      border: 1px solid var(--c-border-light);
      border-radius: var(--radius-pill);
      padding: 3px 10px;
      color: var(--c-ink-light);
      cursor: pointer;
      text-decoration: none;
      transition: border-color var(--motion-fast) var(--ease-out),
                  color var(--motion-fast) var(--ease-out);
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.08em;
    }
    .entry-chip:hover { border-color: var(--c-teal); color: var(--c-teal-bright); }
    .entry-chip.loc::before  { content: '📍 '; }
    .entry-chip.char::before { content: '★ '; }
    .entry-chip.npc::before  { content: '☉ '; }

    /* DM-only divider before planned entries */
    .planned-divider {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: var(--space-7) 0 var(--space-3);
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--c-brass);
    }
    .planned-divider::before, .planned-divider::after {
      content: '';
      flex: 1; height: 1px;
      background: rgba(184,138,90,0.40);
    }

    /* Footer */
    .footer {
      margin-top: var(--space-7);
      text-align: center;
      padding-top: var(--space-4);
      border-top: 1px solid var(--c-border);
    }
    .footer-text {
      font-family: var(--font-display);
      font-size: var(--text-2xs);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--c-ink-dim);
    }

    /* ── Narrow layout polish ── */
    @media (max-width: 560px) {
      .entry { padding: var(--space-3) var(--space-4); }
      .entry-title { font-size: var(--text-sm); }
      .entry-dates { margin-left: 0; width: 100%; }
      .filters-count { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="chronicle-title">

    <div class="topbar">
      <h1 id="chronicle-title">The <span class="accent">Chronicle</span></h1>
      <div class="topbar-meta">
        <span id="role-line">— loading —</span>
        <a href="home.html" class="btn btn--ghost btn--sm">⌂ Hub</a>
      </div>
    </div>

    <div class="hero-strip">
      <div class="hero-strip-tag">A Record of the Realm</div>
      <p class="hero-strip-subtitle" id="hero-subtitle">What has happened, when, and to whom.</p>
    </div>

    <div class="filters" role="search">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search title, body, date…" oninput="render()" aria-label="Search the chronicle">
      </div>
      <select id="kind-filter" onchange="render()" aria-label="Filter by kind">
        <option value="">All kinds</option>
        <option value="session">Sessions</option>
        <option value="event">Events</option>
        <option value="milestone">Milestones</option>
        <option value="planned" id="kind-planned-opt">Planned (DM)</option>
      </select>
      <select id="sort" onchange="render()" aria-label="Sort order">
        <option value="desc">Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
      <button type="button" class="btn btn--ghost btn--sm" id="toggle-all" onclick="toggleAll()">Expand all</button>
      <div class="filters-count" id="filters-count" aria-live="polite"></div>
    </div>

    <div id="state" class="state" role="status" aria-live="polite">
      <svg class="state-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M14 8 L34 8 L34 40 L14 40 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="14" y1="8" x2="14" y2="40" stroke="currentColor" stroke-width="2.4"/>
        <line x1="18" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.4"/>
        <line x1="18" y1="22" x2="30" y2="22" stroke="currentColor" stroke-width="1.4"/>
        <line x1="18" y1="28" x2="26" y2="28" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      Loading the chronicle…
    </div>
    <div id="entries"></div>

    <footer class="footer">
      <p class="footer-text">The Spire · Chronicle</p>
    </footer>
  </main>

  <script src="auth.js"></script>
  <script>
    const WORKER_URL = (window.Auth && window.Auth.WORKER_URL) || 'https://dnd-perk-webhook.jacobgiff.workers.dev/';

    let entries  = [];
    let isDM     = false;
    let expanded = new Set();        // entry ids the user has explicitly opened

    function esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // Expand / collapse state ─────────────────────────────────────
    function toggleEntry(id, ev) {
      if (ev) ev.stopPropagation();
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      const el = document.getElementById('entry-' + id);
      if (el) {
        const willOpen = !el.classList.contains('expanded');
        el.classList.toggle('expanded');
        el.querySelector('.entry-head')?.setAttribute('aria-expanded', String(willOpen));
      }
      refreshToggleAllLabel();
    }
    function toggleAll() {
      const btn = document.getElementById('toggle-all');
      const ids = currentFilteredIds();
      const allOpen = ids.length > 0 && ids.every(id => expanded.has(id));
      if (allOpen) {
        ids.forEach(id => expanded.delete(id));
        btn.textContent = 'Expand all';
      } else {
        ids.forEach(id => expanded.add(id));
        btn.textContent = 'Collapse all';
      }
      render();
    }
    function refreshToggleAllLabel() {
      const btn = document.getElementById('toggle-all');
      const ids = currentFilteredIds();
      const allOpen = ids.length > 0 && ids.every(id => expanded.has(id));
      btn.textContent = allOpen ? 'Collapse all' : 'Expand all';
    }
    function currentFilteredIds() {
      return [...document.querySelectorAll('#entries .entry')].map(el => el.id.replace(/^entry-/, ''));
    }

    async function bootstrap() {
      const ident = Auth.identity();
      const roleEl = document.getElementById('role-line');
      const kindPlannedOpt = document.getElementById('kind-planned-opt');
      const stateEl = document.getElementById('state');
      isDM = (ident.role === 'dm');

      // Identity line: name + role chip (matches home.html chip system)
      const chipCls = ident.role === 'dm' ? 'chip--dm' : ident.role === 'player' ? 'chip--player' : 'chip--anon';
      const chipLabel = ident.role === 'dm' ? 'DM' : ident.role === 'player' ? 'Player' : 'Visitor';
      roleEl.innerHTML = `Viewing as <strong>${esc(ident.display || 'Visitor')}</strong> <span class="chip ${chipCls}">${chipLabel}</span>`;

      // Role-specific subtitle
      const sub = document.getElementById('hero-subtitle');
      sub.textContent =
        isDM                       ? 'Every thread, every page. Planned entries appear below the line.'
      : (ident.role === 'player')  ? 'What has happened — and what your character has seen of it.'
      :                              'The history of this world, as it has been written.';

      // Non-DM viewers don't see planned entries at all (filtered server-side)
      if (!isDM) kindPlannedOpt.style.display = 'none';

      try {
        if (isDM) {
          const r = await fetch(WORKER_URL + '?type=timeline_dm', { cache:'no-store', headers: Auth.dmHeaders() });
          if (r.status === 401) { showError(stateEl, 'Your DM session expired — sign in again on the home page.'); return; }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          entries = await r.json();
        } else if (ident.role === 'player') {
          const creds = Auth.playerCreds();
          const u = `${WORKER_URL}?type=timeline_view&characterId=${encodeURIComponent(creds.characterId)}&code=${encodeURIComponent(creds.code)}`;
          const r = await fetch(u, { cache:'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          entries = await r.json();
        } else {
          const r = await fetch(WORKER_URL + '?type=timeline', { cache:'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          entries = await r.json();
        }
        if (!Array.isArray(entries)) entries = [];
      } catch (e) {
        showError(stateEl, 'Could not reach the chronicle.');
        return;
      }

      // Fetch character / location / NPC names for chip labels (best-effort).
      try {
        const cl = await Auth.characterList();
        nameMaps.characters = Object.fromEntries((cl || []).map(c => [c.id, c.name]));
      } catch {}
      try {
        const r = await fetch(WORKER_URL + '?type=map_data', { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          nameMaps.locations = Object.fromEntries((d?.locations || []).map(l => [l.id, l.name]));
        }
      } catch {}
      try {
        if (ident.role === 'player') {
          const creds = Auth.playerCreds();
          const r = await fetch(`${WORKER_URL}?type=npc_roster&characterId=${encodeURIComponent(creds.characterId)}&code=${encodeURIComponent(creds.code)}`, { cache: 'no-store' });
          if (r.ok) {
            const arr = await r.json();
            nameMaps.npcs = Object.fromEntries((arr || []).map(n => [n.id, n.name]));
          }
        } else if (isDM) {
          const r = await fetch(WORKER_URL + '?type=npcs', { cache: 'no-store', headers: Auth.dmHeaders() });
          if (r.ok) {
            const arr = await r.json();
            nameMaps.npcs = Object.fromEntries((arr || []).map(n => [n.id, n.name]));
          }
        }
      } catch {}

      render();
    }

    function showError(el, msg) {
      el.classList.add('error');
      el.textContent = msg;
    }

    const nameMaps = { locations: {}, characters: {}, npcs: {} };

    function sortKey(e) { return (e.dateSort || '') + '~' + (e.id || ''); }

    function render() {
      const state = document.getElementById('state');
      const list  = document.getElementById('entries');
      const count = document.getElementById('filters-count');
      const query = (document.getElementById('search').value || '').trim().toLowerCase();
      const kindF = document.getElementById('kind-filter').value;
      const sort  = document.getElementById('sort').value;

      let filtered = entries.filter(e => {
        if (kindF && e.kind !== kindF) return false;
        if (!query) return true;
        return (e.title || '').toLowerCase().includes(query)
            || (e.body  || '').toLowerCase().includes(query)
            || (e.dateInGame || '').toLowerCase().includes(query);
      });
      filtered.sort((a, b) => sort === 'asc'
        ? sortKey(a).localeCompare(sortKey(b))
        : sortKey(b).localeCompare(sortKey(a)));

      // Update results count
      count.innerHTML = filtered.length === entries.length
        ? `<strong>${entries.length}</strong> ${entries.length === 1 ? 'entry' : 'entries'}`
        : `<strong>${filtered.length}</strong> of ${entries.length}`;

      if (filtered.length === 0) {
        state.style.display = '';
        state.classList.remove('error');
        state.innerHTML = entries.length === 0
          ? `<svg class="state-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M14 8 L34 8 L34 40 L14 40 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><line x1="14" y1="8" x2="14" y2="40" stroke="currentColor" stroke-width="2.4"/></svg>The chronicle is empty.`
          : `<svg class="state-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="14" stroke="currentColor" stroke-width="1.8"/><line x1="32" y1="32" x2="42" y2="42" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>No entries match those filters.`;
        list.innerHTML = '';
        return;
      }
      state.style.display = 'none';

      // For DM viewers, render planned entries in a separate bottom block
      // (visually distinct), unless they explicitly filtered to a single kind.
      const showPlannedDivider = isDM && !kindF;
      const past    = showPlannedDivider ? filtered.filter(e => e.kind !== 'planned') : filtered;
      const planned = showPlannedDivider ? filtered.filter(e => e.kind === 'planned') : [];

      let i = 0;
      const pastHtml = past.map(e => renderEntry(e, i++)).join('');
      const plannedHtml = planned.length
        ? `<div class="planned-divider">Planned</div>${planned.map(e => renderEntry(e, i++)).join('')}`
        : '';
      list.innerHTML = pastHtml + plannedHtml;
      refreshToggleAllLabel();
    }

    function renderEntry(e, i) {
      const kind     = e.kind || 'event';
      const dateGame = e.dateInGame || '';
      const dateReal = e.dateReal   || e.dateSort || '';
      const tags     = Array.isArray(e.tags) ? e.tags.filter(Boolean) : [];
      const isOpen   = expanded.has(e.id);

      const locChips  = (e.locationIds  || []).map(id => `<a class="entry-chip loc"  href="map.html#${esc(id)}">${esc(nameMaps.locations[id]  || id)}</a>`).join('');
      const charChips = (e.characterIds || []).map(id => `<span class="entry-chip char">${esc(nameMaps.characters[id] || id)}</span>`).join('');
      const npcChips  = (e.npcIds       || []).map(id => `<span class="entry-chip npc">${esc(nameMaps.npcs[id]       || id)}</span>`).join('');
      const allChips  = locChips + charChips + npcChips;

      const realDateAttr = /^\d{4}-\d{2}-\d{2}$/.test(dateReal) ? ` datetime="${esc(dateReal)}"` : '';

      // Header is the click/keyboard target; aria-expanded reflects state.
      return `
        <article class="entry kind-${esc(kind)}${isOpen ? ' expanded' : ''}" id="entry-${esc(e.id)}" style="--entry-i:${i}">
          <div class="entry-head" role="button" tabindex="0"
               aria-expanded="${isOpen}"
               aria-controls="entry-body-${esc(e.id)}"
               onclick="toggleEntry('${esc(e.id)}', event)"
               onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleEntry('${esc(e.id)}',event)}">
            <span class="entry-kind ${esc(kind)}">${esc(kind)}</span>
            <span class="entry-title">${esc(e.title || '(Untitled)')}</span>
            <div class="entry-dates">
              ${dateGame ? `<span class="entry-date">${esc(dateGame)}</span>` : ''}
              ${dateReal ? `<time class="entry-date real"${realDateAttr}>${esc(dateReal)}</time>` : ''}
            </div>
            <span class="entry-toggle" aria-hidden="true">▸</span>
          </div>
          ${tags.length ? `<div class="entry-tags">${tags.map(t => `<span class="entry-tag">#${esc(t)}</span>`).join('')}</div>` : ''}
          <div id="entry-body-${esc(e.id)}">
            ${e.body ? `<div class="entry-body">${esc(e.body)}</div>` : ''}
            ${renderCombats(e.combats)}
            ${renderLoot(e.loot)}
            ${isDM && e.dmNotes ? `<div class="entry-dmnotes"><div class="entry-dmnotes-label">DM Notes</div>${esc(e.dmNotes)}</div>` : ''}
            ${allChips ? `<div class="entry-meta">${allChips}</div>` : ''}
          </div>
        </article>
      `;
    }

    function renderCombats(combats) {
      if (!Array.isArray(combats) || combats.length === 0) return '';
      return combats.map(c => {
        const downed   = (c.pcsDowned || []).map(esc).join(', ');
        const defeated = (c.enemiesDefeated || []).map(esc).join(', ');
        return `
          <div class="entry-combat">
            <div class="entry-combat-head">⚔ ${esc(c.title || 'Combat')} — <span class="outcome">${esc(c.outcome || '')}</span></div>
            <div class="entry-combat-line">
              ${c.rounds ? `<span class="lbl">Rounds:</span> ${esc(String(c.rounds))} ` : ''}
              ${c.location ? `&nbsp;·&nbsp; <span class="lbl">Where:</span> ${esc(c.location)}` : ''}
            </div>
            ${defeated ? `<div class="entry-combat-line"><span class="lbl">Defeated:</span> ${defeated}</div>` : ''}
            ${downed   ? `<div class="entry-combat-line"><span class="lbl">Downed:</span> ${downed}</div>` : ''}
            ${isDM && c.dmDetail ? `<details class="entry-combat-detail"><summary>Full combat log (DM only)</summary><pre>${esc(c.dmDetail)}</pre></details>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderLoot(loot) {
      if (!Array.isArray(loot) || loot.length === 0) return '';
      const rows = loot.map(l => `
        <tr>
          <td>${esc(l.item || '')}</td>
          <td class="qty">${esc(String(l.qty || '1'))}</td>
          <td class="who">${esc(l.recipient || 'Party')}</td>
        </tr>
      `).join('');
      return `
        <div class="entry-loot">
          <div class="entry-loot-title">Loot</div>
          <table class="loot-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Who</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    bootstrap();
  </script>
</body>
</html>
