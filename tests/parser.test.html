<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Crucible parser tests</title>
  <style>
    body { font: 14px monospace; background:#0e1418; color:#dde7e9; padding:1rem; }
    h1 { color:#7ec5c5; }
    button { padding:0.5rem 1rem; background:#1d3a4a; color:#dde7e9;
             border:1px solid #2c5566; cursor:pointer; }
    .ok   { color:#7fd49a; }
    .fail { color:#e77878; }
    .case { padding:0.25rem 0; border-bottom:1px solid #1c2429; }
    pre   { white-space:pre-wrap; color:#a0adb2; margin:0.25rem 0 0 1rem; }
    #summary { padding:0.75rem; margin-top:1rem; background:#152028;
               border-left:3px solid #7ec5c5; }
  </style>
</head>
<body>
<h1>Crucible parser tests</h1>
<button onclick="runAll()">Run tests</button>
<div id="results"></div>
<div id="summary"></div>

<script src="../crucible-parser.js"></script>
<script>
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
function assertEq(actual, expected, label) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((label || '') +
    '\n   expected: ' + e + '\n     actual: ' + a);
}
function assertHas(obj, key, label) {
  if (!(key in obj)) throw new Error((label || '') + '\n   missing key: ' + key);
}
function assertTrue(cond, label) { if (!cond) throw new Error(label || 'expected true'); }
async function runAll() {
  const root = document.getElementById('results');
  root.innerHTML = '';
  let pass = 0, fail = 0;
  for (const t of TESTS) {
    const div = document.createElement('div');
    div.className = 'case';
    try {
      await t.fn();
      div.innerHTML = '<span class="ok">✓</span> ' + t.name;
      pass++;
    } catch (e) {
      div.innerHTML = '<span class="fail">✗</span> ' + t.name +
        '<pre>' + (e.message || String(e)) + '</pre>';
      fail++;
    }
    root.appendChild(div);
  }
  document.getElementById('summary').innerHTML =
    `<b>${pass} passed</b>, <b class="${fail?'fail':'ok'}">${fail} failed</b>, ${TESTS.length} total.`;
}
</script>

<script>
test('Pass 4: gibberish body → kind:unparsed', () => {
  const out = CrucibleParser.parseAction('Mystery', 'something undecipherable', null, 2);
  assertEq(out.kind, 'unparsed');
  assertEq(out.sourceActionName, 'Mystery');
  assertEq(out._raw, 'something undecipherable');
});
test('Pass 4: empty body still produces ParsedAction shape', () => {
  const out = CrucibleParser.parseAction('Nothing', '', null, 2);
  assertEq(out.kind, 'unparsed');
  assertEq(out._raw, '');
});
test('Pass 1: actionName "Multiattack" → kind:multiattack', () => {
  const body = 'The aarakocra makes two Wind Staff attacks, and it can use Spellcasting to cast Gust of Wind.';
  const out = CrucibleParser.parseAction('Multiattack', body, null, 2);
  assertEq(out.kind, 'multiattack');
  assertEq(out.multiattackPlan, [{ actionName:'Wind Staff', count:2 }]);
});
test('Pass 1: "two Bite attacks and one Tail attack"', () => {
  const body = 'The dragon makes two Bite attacks and one Tail attack.';
  const out = CrucibleParser.parseAction('Multiattack', body, null, 2);
  assertEq(out.multiattackPlan, [
    { actionName:'Bite', count:2 },
    { actionName:'Tail', count:1 },
  ]);
});
test('Pass 1: "makes two attacks: one with Longsword and one with Shortbow"', () => {
  const body = 'The fighter makes two attacks: one with its Longsword and one with its Shortbow.';

});

  const body = 'The wolf makes three Bite attacks.';
  const out = CrucibleParser.parseAction('Frenzy', body, null, 2);
  assertEq(out.kind, 'multiattack');

});
test('Pass 1: no multiattack language → falls through (NOT multiattack)', () => {

  assertTrue(out.kind !== 'multiattack', 'should not classify as multiattack');
});

// helper: parse a monster and return the parsed action by (fuzzy) name
function parsedByName(monster, name) {
  CrucibleParser.parseAllMonsterActions(monster);
  return monster.parsedActions.find(p => p.sourceActionName === name);
}

// ── Attack header / to-hit gaps ──
test('Attack: "Melee Weapon Attack." (period terminator) parses', () => {
  const out = CrucibleParser.parseAction('Claws',
    'Melee Weapon Attack. +5 to hit, reach 5 ft. Hit: 12 (2d8 + 3) Slashing damage.', null, 2);
  assertEq(out.kind, 'attack');
  assertEq(out.toHit, 5);
  assertEq(out.actionRange, 'melee');
  assertEq(out.damage, [{ dice:'2d8', mod:3, type:'slashing' }]);
});
test('Attack: "Melee or Ranged Spell Attack:" → actionRange both', () => {
  const out = CrucibleParser.parseAction('Lightning Jolt',
    'Melee or Ranged Spell Attack: +6 to hit, reach 5 ft. or range 30 ft. Hit: 3 (1d6) Lightning damage.', null, 3);
  assertEq(out.kind, 'attack');
  assertEq(out.toHit, 6);
  assertEq(out.actionRange, 'both');

test('Attack: headerless "+8 to hit, reach 5 ft." (2014 short form)', () => {

// ── Multiattack phrasings (resolved against sibling actions) ──
function bandit(maBody) {
  return {
    name: 'Bandit',
    actions: [
      { name:'Multiattack', body: maBody },
      { name:'Scimitar', body:'Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Slashing damage.' },  // avg 5.5
      { name:'Pistol',   body:'Ranged Attack Roll: +5, range 30 ft. Hit: 9 (2d6 + 2) Piercing damage.' }, // avg 9.0
    ],
    bonusActions: [], reactions: [], traits: [],
  };
}
test('Multiattack: "using X or Y in any combination" → best-damage option', () => {
  const ma = parsedByName(bandit('The bandit makes two attacks, using Scimitar or Pistol in any combination.'), 'Multiattack');
  assertEq(ma.kind, 'multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Pistol', count:2 }]);
});
test('Multiattack: "makes N X or Y attacks" (shared count) → best option', () => {
  const ma = parsedByName(bandit('The bandit makes three Scimitar or Pistol attacks.'), 'Multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Pistol', count:3 }]);
});
test('Multiattack: weighted "makes N X attacks or M Y attacks" → best by count×dmg', () => {
  // 4×Scimitar(5.5)=22 vs 2×Pistol(9)=18 → Scimitar wins.
  const ma = parsedByName(bandit('The bandit makes four Scimitar attacks or two Pistol attacks.'), 'Multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Scimitar', count:4 }]);
});
test('Multiattack: bare "makes two attacks" → monster’s best attack', () => {
  const ma = parsedByName(bandit('The bandit makes two attacks.'), 'Multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Pistol', count:2 }]);
});
test('Multiattack: generic "makes two melee attacks" → best attack', () => {
  const ma = parsedByName(bandit('The bandit makes two melee attacks.'), 'Multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Pistol', count:2 }]);
});
test('Multiattack: "uses X three times" (beholder-style)', () => {
  const monster = {
    name: 'Beholder',
    actions: [
      { name:'Multiattack', body:'The beholder uses Eye Rays three times.' },
      { name:'Eye Rays', body:'Ranged Attack Roll: +5, range 120 ft. Hit: 10 (3d6) Force damage.' },
    ], bonusActions: [], reactions: [], traits: [],
  };
  const ma = parsedByName(monster, 'Multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Eye Rays', count:3 }]);
});
test('Multiattack: fuzzy singular/plural — "Claw" step matches "Claws" action', () => {
  const monster = {
    name: 'Bear',
    actions: [
      { name:'Multiattack', body:'The bear makes two Claw attacks.' },
      { name:'Claws', body:'Melee Attack Roll: +6, reach 5 ft. Hit: 11 (2d6 + 4) Slashing damage.' },
    ], bonusActions: [], reactions: [], traits: [],
  };
  const ma = parsedByName(monster, 'Multiattack');
  assertEq(ma.multiattackPlan, [{ actionName:'Claws', count:2 }]);
});
test('Multiattack: invalid sub-action name (no match) → degrades to unparsed', () => {
  const monster = {
    name: 'Thing',
    actions: [
      { name:'Multiattack', body:'The thing makes three Zorptacle attacks.' },
      { name:'Bite', body:'Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage.' },
    ], bonusActions: [], reactions: [], traits: [],
  };
  const ma = parsedByName(monster, 'Multiattack');
  assertEq(ma.kind, 'unparsed');
  assertTrue(!('multiattackPlan' in ma), 'broken plan removed');
});
test('Multiattack guard: save-primary body mentioning an attack is NOT hijacked', () => {
  const out = CrucibleParser.parseAction('Bloodcurdling Shriek',
    'The deathhawk shrieks, and each enemy within 30 feet must make a DC 14 Wisdom saving throw. On a failure it makes one Beak attack against them.', null, 4);
  assertEq(out.kind, 'save');
  assertEq(out.saveDc, 14);
});
test('Multiattack guard: attack-header body with a "makes … attacks" tail parses as attack', () => {
  const out = CrucibleParser.parseAction('Devolving Tentacle',
    'Melee Attack Roll: +9, reach 20 ft. Hit: 12 (2d6 + 5) Piercing damage. Afterward the creature makes two Flail attacks.', null, 5);
  assertEq(out.kind, 'attack');
  assertEq(out.toHit, 9);
});

test('Thrown: handaxe "Melee or Ranged … reach 5 ft. or range 20/60 ft." → thrown, both', () => {
  const out = CrucibleParser.parseAction('Handaxe',
    'Melee or Ranged Attack Roll: +4, reach 5 ft. or range 20/60 ft. Hit: 7 (1d6 + 4) Slashing damage.');
  assertEq(out.kind, 'attack');
  assertEq(out.actionRange, 'both');
  assertEq(out.thrown, true);
  assertEq(out.reach, 5);
  assertEq(out.range, [20, 60]);
});

test('Thrown: pure ranged weapon (bow) is NOT thrown', () => {
  const out = CrucibleParser.parseAction('Longbow',
    'Ranged Attack Roll: +5, range 150/600 ft. Hit: 6 (1d8 + 2) Piercing damage.');
  assertEq(out.actionRange, 'ranged');
  assertTrue(!('thrown' in out) || out.thrown === undefined, 'bow must not be flagged thrown');
});

test('Thrown: explicit "thrown" keyword flags a melee-header spear', () => {
  const out = CrucibleParser.parseAction('Spear',
    'Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d8 + 2) Piercing damage. This is a thrown weapon (range 20/60).');
  assertEq(out.kind, 'attack');
  assertEq(out.thrown, true);
});

test('Thrown: pure melee weapon (no range, no keyword) is NOT thrown', () => {
  const out = CrucibleParser.parseAction('Slam',
    'Melee Attack Roll: +7, reach 10 ft. Hit: 15 (2d8 + 6) Bludgeoning damage.');
  assertEq(out.actionRange, 'melee');
  assertTrue(!('thrown' in out) || out.thrown === undefined, 'pure melee must not be flagged thrown');
});
