<html>
<head>
<meta charset="utf-8">
<title>crucible-spatial tests</title>
<style>
  body { font-family: monospace; background: #0e1418; color: #dde7e9; padding: 1rem; }
  .pass { color: #6dd58c; }
  .fail { color: #d97a7a; }
  button { padding: 0.5rem 1rem; background: #1d3a4a; color: #dde7e9; border: 1px solid #1c2429; cursor: pointer; }
  pre { white-space: pre-wrap; margin-top: 0.5rem; }

<body>
<h1>crucible-spatial tests</h1>
<button onclick="runAll()">Run tests</button>
<pre id="out"></pre>

<script src="../crucible-spatial.js"></script>
<script>
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
function group(name) { TESTS.push({ group: name }); }
function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'assertion failed');
}
function assertEq(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((msg || 'mismatch') + ': ' + a + ' vs ' + e);
}
function assertClose(a, b, eps) {
  if (Math.abs(a - b) > (eps || 0.001)) throw new Error('close mismatch: ' + a + ' vs ' + b);
}
function runAll() {
  const out = document.getElementById('out');
  let passed = 0, failed = 0;
  const lines = [];
  for (const t of TESTS) {
    if (t.group) { lines.push('\n— ' + t.group + ' —'); continue; }
    try { t.fn(); lines.push('<span class="pass">✓ ' + t.name + '</span>'); passed++; }
    catch (e) { lines.push('<span class="fail">✗ ' + t.name + ' — ' + e.message + '</span>'); failed++; }
  }
  lines.push('\n' + passed + ' passed, ' + failed + ' failed');
  out.innerHTML = lines.join('\n');
}

// === Tests below this line ===

group('chebyshev');

test('chebyshev: same cell → 0', () => {
  assertEq(CrucibleSpatial.chebyshev({x:5,y:5}, {x:5,y:5}), 0);
});
test('chebyshev: orthogonal 1 step → 1', () => {
  assertEq(CrucibleSpatial.chebyshev({x:5,y:5}, {x:6,y:5}), 1);
  assertEq(CrucibleSpatial.chebyshev({x:5,y:5}, {x:5,y:6}), 1);
});
test('chebyshev: diagonal 1 step → 1 (5e RAW)', () => {
  assertEq(CrucibleSpatial.chebyshev({x:5,y:5}, {x:6,y:6}), 1);
});
test('chebyshev: 3 right, 4 up → 4 (max axis)', () => {
  assertEq(CrucibleSpatial.chebyshev({x:0,y:0}, {x:3,y:4}), 4);
});

group('findPath (A*)');

// Tiny helper to build a map quickly. blocked is a list of [x,y] pairs.
function mkMap(width, height, blocked) {
  const m = { width, height, blocked: null };
  if (blocked && blocked.length) {
    m.blocked = Array.from({length: height}, () => new Array(width).fill(false));
    for (const [x, y] of blocked) m.blocked[y][x] = true;
  }
  return m;
}

test('findPath: open grid, straight line', () => {
  const map = mkMap(10, 10, []);
  const path = CrucibleSpatial.findPath({x:1,y:1}, {x:4,y:1}, map, {});
  // Multiple length-3 paths are valid (diagonals allowed); just check length + endpoint.
  assertEq(path.length, 3);
  assertEq(path[path.length - 1], {x:4,y:1});
});

test('findPath: diagonal allowed (Chebyshev)', () => {
  const map = mkMap(10, 10, []);
  const path = CrucibleSpatial.findPath({x:0,y:0}, {x:3,y:3}, map, {});
  assertEq(path.length, 3);  // 3 diagonal steps
  assertEq(path[path.length - 1], {x:3,y:3});
});

test('findPath: routes around a single blocked cell', () => {
  // Block (2,1). Path from (1,1) → (4,1) goes around.
  const map = mkMap(10, 10, [[2,1]]);
  const path = CrucibleSpatial.findPath({x:1,y:1}, {x:4,y:1}, map, {});
  assert(path.length > 0, 'should find a path');
  assertEq(path[path.length - 1], {x:4,y:1});
  // None of the cells should be the blocked one.
  assert(!path.some(c => c.x === 2 && c.y === 1), 'path crossed blocked cell');
});

test('findPath: unreachable → empty array', () => {
  // Block all 8 neighbors of the goal so it's truly isolated.
  const blocked = [[2,1],[3,1],[4,1],[2,2],[4,2],[2,3],[3,3],[4,3]];
  const map = mkMap(10, 10, blocked);
  const path = CrucibleSpatial.findPath({x:0,y:0}, {x:3,y:2}, map, {});
  assertEq(path, []);
});

test('findPath: maxSteps caps the path length', () => {
  const map = mkMap(20, 20, []);
  const path = CrucibleSpatial.findPath({x:0,y:0}, {x:10,y:10}, map, { maxSteps: 3 });
  // Goal not reachable in 3 steps; expect best-effort partial path of length 3.
  assertEq(path.length, 3);
});

test('findPath: stopWhenAdjacent stops one cell short', () => {
  const map = mkMap(10, 10, []);
  const goalCombatant = { x: 6, y: 1 };
  const path = CrucibleSpatial.findPath({x:1,y:1}, {x:6,y:1}, map, { stopWhenAdjacent: goalCombatant });
  // Path should land in any cell adjacent to (6,1) but not on it.
  const last = path[path.length - 1];
  const dx = Math.abs(last.x - 6), dy = Math.abs(last.y - 1);
  assert(Math.max(dx, dy) === 1, 'last cell ' + JSON.stringify(last) + ' not adjacent to (6,1)');
});

test('findPath: empty path if start === goal', () => {
  const map = mkMap(10, 10, []);
  const path = CrucibleSpatial.findPath({x:3,y:3}, {x:3,y:3}, map, {});
  assertEq(path, []);
});

test('findPath: occupied cells block the path', () => {
  // A wall of occupied cells at x=3, y=0..2 forces a detour from (1,1) to (5,1).
  const map = mkMap(10, 10, []);
  const occupied = new Set(['3,0','3,1','3,2']);
  const path = CrucibleSpatial.findPath({x:1,y:1}, {x:5,y:1}, map, { occupied });
  assertEq(path[path.length - 1], {x:5,y:1});
  for (const c of path) {
    assert(!occupied.has(c.x + ',' + c.y), 'path passes through occupied cell ' + JSON.stringify(c));
  }
});

group('placeCombatants');

test('placeCombatants: 2 PCs, 2 monsters on a 10×10 map', () => {
  const combatants = [
    { id: 'pc:1', side: 'pc' },
    { id: 'pc:2', side: 'pc' },
    { id: 'mon:0', side: 'monster' },
    { id: 'mon:1', side: 'monster' },
  ];
  const map = { width: 10, height: 10, blocked: null };
  CrucibleSpatial.placeCombatants(combatants, map, null);
  // PCs at y=1, monsters at y=8.
  assertEq(combatants[0].y, 1);
  assertEq(combatants[1].y, 1);
  assertEq(combatants[2].y, 8);
  assertEq(combatants[3].y, 8);
  // PCs and monsters spread across width.
  assert(combatants[0].x !== combatants[1].x, 'PCs shouldnt overlap');
  assert(combatants[2].x !== combatants[3].x, 'monsters shouldnt overlap');
});

test('placeCombatants: override array sets explicit positions', () => {
  const combatants = [
    { id: 'pc:a', side: 'pc' },
    { id: 'mon:b', side: 'monster' },
  ];
  const map = { width: 10, height: 10, blocked: null };
  const override = [{ id: 'pc:a', x: 4, y: 4 }, { id: 'mon:b', x: 7, y: 7 }];
  CrucibleSpatial.placeCombatants(combatants, map, override);
  assertEq(combatants[0].x, 4);
  assertEq(combatants[0].y, 4);
  assertEq(combatants[1].x, 7);
  assertEq(combatants[1].y, 7);
});

test('placeCombatants: partial override fills the rest with default placement', () => {
  const combatants = [
    { id: 'pc:1', side: 'pc' },
    { id: 'pc:2', side: 'pc' },
    { id: 'mon:0', side: 'monster' },
  ];
  const map = { width: 10, height: 10, blocked: null };
  // Only override PCs.
  const override = [{ id: 'pc:1', x: 2, y: 2 }, { id: 'pc:2', x: 4, y: 2 }];
  CrucibleSpatial.placeCombatants(combatants, map, override);
  assertEq(combatants[0].x, 2);
  assertEq(combatants[2].y, 8);  // monster gets default y=height-2=8
  assert(combatants[2].x >= 0 && combatants[2].x < map.width, 'monster placed in bounds');
});

test('placeCombatants: 6 PCs evenly spaced on a 20-wide map', () => {
  const combatants = Array.from({length: 6}, (_, i) => ({ id: 'pc:' + i, side: 'pc' }));
  const map = { width: 20, height: 20, blocked: null };
  CrucibleSpatial.placeCombatants(combatants, map, null);
  const xs = combatants.map(c => c.x).sort((a,b) => a-b);
  // No two PCs at same x.
  for (let i = 1; i < xs.length; i++) assert(xs[i] > xs[i-1], 'PCs overlap at x=' + xs[i]);
  // All within map bounds.
  for (const c of combatants) {
    assert(c.x >= 0 && c.x < map.width);
    assertEq(c.y, 1);
  }
});

test('placeCombatants: lone PC centered at x=floor(width/2)', () => {
  const combatants = [{ id: 'pc:0', side: 'pc' }];
  const map = { width: 11, height: 11, blocked: null };
  CrucibleSpatial.placeCombatants(combatants, map, null);
  assertEq(combatants[0].x, 5);
  assertEq(combatants[0].y, 1);
});

test('placeCombatants: monsters at height-2', () => {
  const combatants = [{ id: 'mon:0', side: 'monster' }];
  const map = { width: 10, height: 15, blocked: null };
  CrucibleSpatial.placeCombatants(combatants, map, null);
  assertEq(combatants[0].y, 13);
});

group('computeThreat');

test('computeThreat: assigns positive threat to combatants with HP', () => {
  const cs = [
    { id: 'a', hp: 30, maxHp: 30, pm: { actions: [{ damage: { dice: '1d6', mod: 3, type: 'piercing' } }] }, side: 'pc' },
  ];
  CrucibleSpatial.computeThreat(cs);
  assert(cs[0].threat > 0, 'threat should be positive: ' + cs[0].threat);
});

test('computeThreat: higher HP → higher threat (all else equal)', () => {
  const a = { id: 'a', hp: 30, maxHp: 30, pm: { actions: [{ damage: { dice: '1d6', mod: 3 } }] }, side: 'pc' };
  const b = { id: 'b', hp: 60, maxHp: 60, pm: { actions: [{ damage: { dice: '1d6', mod: 3 } }] }, side: 'pc' };
  CrucibleSpatial.computeThreat([a, b]);
  assert(b.threat > a.threat, 'b should outrank a');
});

test('computeThreat: bigger weapon → higher threat', () => {
  const a = { id: 'a', hp: 30, maxHp: 30, pm: { actions: [{ damage: { dice: '1d4', mod: 1 } }] }, side: 'pc' };
  const b = { id: 'b', hp: 30, maxHp: 30, pm: { actions: [{ damage: { dice: '2d6', mod: 3 } }] }, side: 'pc' };
  CrucibleSpatial.computeThreat([a, b]);
  assert(b.threat > a.threat, 'b should outrank a');
});

test('computeThreat: no actions → low (non-zero) threat', () => {
  const cs = [{ id: 'a', hp: 30, maxHp: 30, pm: { actions: [] }, side: 'pc' }];
  CrucibleSpatial.computeThreat(cs);
  assert(cs[0].threat >= 0, 'threat should not be negative');
});

});

});

test('sphereCells: radius 2 → 5×5 square = 25 cells', () => {

  assertEq(cells.length, 25);
});

test('sphereCells: cells are within radius', () => {
  const cells = CrucibleSpatial.sphereCells({x:5,y:5}, 2);
  for (const c of cells) {
    assert(Math.max(Math.abs(c.x - 5), Math.abs(c.y - 5)) <= 2);

group('AoE: cubeCells');

test('cubeCells: side 1 → 1 cell', () => {
  const cells = CrucibleSpatial.cubeCells({x:5,y:5}, 1);
  assertEq(cells.length, 1);
});

test('cubeCells: side 3 → 9 cells', () => {
  const cells = CrucibleSpatial.cubeCells({x:5,y:5}, 3);

  const cells = CrucibleSpatial.lineCells({x:5,y:5}, {dx:-1,dy:-1}, 3);
  assertEq(cells, [{x:4,y:4},{x:3,y:3},{x:2,y:2}]);

  assertEq(CrucibleSpatial.lineCells({x:5,y:5}, {dx:1,dy:0}, 0), []);
});

test('lineCells: zero direction → empty', () => {
  assertEq(CrucibleSpatial.lineCells({x:5,y:5}, {dx:0,dy:0}, 3), []);
});

group('AoE: coneCells');

test('coneCells: length 1 east → 1 cell', () => {
  const cells = CrucibleSpatial.coneCells({x:5,y:5}, {dx:1,dy:0}, 1);
  assertEq(cells, [{x:6,y:5}]);
});

test('coneCells: length 3 east → 1+2+3 = 6 cells', () => {
  const cells = CrucibleSpatial.coneCells({x:5,y:5}, {dx:1,dy:0}, 3);
  assertEq(cells.length, 6);
});

test('coneCells: length 3 east cells form widening pattern', () => {
  // At distance 1: only y=5. At distance 2: y=5..6. At distance 3: y=4..6.
  const cells = CrucibleSpatial.coneCells({x:5,y:5}, {dx:1,dy:0}, 3);
  assert(cells.find(c => c.x === 6 && c.y === 5), 'missing (6,5)');
  assert(cells.find(c => c.x === 7 && c.y === 5), 'missing (7,5)');
  assert(cells.find(c => c.x === 8 && c.y === 4), 'missing (8,4)');
});

test('coneCells: diagonal direction works', () => {
  const cells = CrucibleSpatial.coneCells({x:0,y:0}, {dx:1,dy:1}, 2);
  assert(cells.length > 0, 'should produce cells');
});

test('coneCells: length 0 → empty', () => {
  assertEq(CrucibleSpatial.coneCells({x:5,y:5}, {dx:1,dy:0}, 0), []);
});

group('AoE: enumerateCastPoints / combatantsAt');

test('enumerateCastPoints: sphere 6-cell radius around attacker', () => {
  const action = { shape: 'sphere', size: 2, range: 6 };
  const map = mkMap(20, 20, []);
  const attacker = { x: 10, y: 10 };
  const pts = CrucibleSpatial.enumerateCastPoints(attacker, action, map);
  assertEq(pts.length, 169);
});

test('enumerateCastPoints: cone iterates 8 directions, range = origin only', () => {
  const action = { shape: 'cone', size: 3, range: 0 };
  const map = mkMap(20, 20, []);
  const attacker = { x: 10, y: 10 };
  const pts = CrucibleSpatial.enumerateCastPoints(attacker, action, map);
  assertEq(pts.length, 8);
  assert(pts.every(p => p.dir && (Math.abs(p.dir.dx) <= 1 && Math.abs(p.dir.dy) <= 1)));
});

test('enumerateCastPoints: candidates respect map bounds', () => {
  const action = { shape: 'sphere', size: 1, range: 99 };
  const map = mkMap(5, 5, []);
  const pts = CrucibleSpatial.enumerateCastPoints({x:2,y:2}, action, map);
  for (const p of pts) {
    assert(p.x >= 0 && p.x < 5 && p.y >= 0 && p.y < 5);
  }
});

test('combatantsAt: returns combatants whose (x,y) is in cells', () => {
  const cells = [{x:1,y:1}, {x:3,y:3}];
  const cs = [
    { id: 'a', x: 1, y: 1, dead: false, downed: false },
    { id: 'b', x: 2, y: 2, dead: false, downed: false },
    { id: 'c', x: 3, y: 3, dead: false, downed: false },
    { id: 'd', x: 3, y: 3, dead: true,  downed: false },
  ];
  const hits = CrucibleSpatial.combatantsAt(cells, cs);
  assertEq(hits.length, 2);
  assert(hits.find(h => h.id === 'a'));
  assert(hits.find(h => h.id === 'c'));
});

group('scoreTarget');

test('scoreTarget: closer target scores higher (all else equal)', () => {
  const attacker = { x: 0, y: 0 };
  const near = { x: 1, y: 0, hp: 30, threat: 5, side: 'monster' };
  const far  = { x: 5, y: 0, hp: 30, threat: 5, side: 'monster' };
  const action = { actionRange: 'melee', range: 1 };
  const map = mkMap(10, 10, []);
  const cs = [attacker, near, far];
  const sNear = CrucibleSpatial.scoreTarget(near, attacker, action, cs, map);
  const sFar  = CrucibleSpatial.scoreTarget(far,  attacker, action, cs, map);
  assert(sNear > sFar, 'near should score higher');
});

test('scoreTarget: lower-HP target scores higher (all else equal)', () => {
  const attacker = { x: 0, y: 0 };
  const low  = { x: 3, y: 0, hp: 5,  threat: 5, side: 'monster' };
  const high = { x: 3, y: 0, hp: 50, threat: 5, side: 'monster' };
  const action = { actionRange: 'melee', range: 1 };
  const cs = [attacker, low, high];
  const sLow  = CrucibleSpatial.scoreTarget(low,  attacker, action, cs, mkMap(10,10,[]));
  const sHigh = CrucibleSpatial.scoreTarget(high, attacker, action, cs, mkMap(10,10,[]));
  assert(sLow > sHigh, 'low-HP should score higher');
});

test('scoreTarget: ranged attack penalized in melee', () => {
  const attacker = { x: 0, y: 0 };
  const adjacent = { x: 1, y: 0, hp: 20, threat: 5, side: 'monster' };
  const meleeAction  = { actionRange: 'melee', range: 1 };
  const rangedAction = { actionRange: 'ranged', range: 6 };
  const cs = [attacker, adjacent];
  const sM = CrucibleSpatial.scoreTarget(adjacent, attacker, meleeAction,  cs, mkMap(10,10,[]));
  const sR = CrucibleSpatial.scoreTarget(adjacent, attacker, rangedAction, cs, mkMap(10,10,[]));
  assert(sM > sR, 'melee should outscore ranged when adjacent');
});

group('scoreTarget aiHint tweaks');

test('scoreTarget: aiHint=focus weights low-HP harder', () => {
  const attacker = { x: 0, y: 0 };
  const low  = { x: 3, y: 0, hp: 5,  threat: 5, side: 'monster' };
  const high = { x: 3, y: 0, hp: 50, threat: 5, side: 'monster' };
  const cs = [attacker, low, high];
  const action = { actionRange: 'melee', range: 1 };
  const map = mkMap(10, 10, []);
  const baseDelta  = CrucibleSpatial.scoreTarget(low, attacker, action, cs, map)
                   - CrucibleSpatial.scoreTarget(high, attacker, action, cs, map);
  const focusDelta = CrucibleSpatial.scoreTarget(low, attacker, action, cs, map, { aiHint: 'focus' })
                   - CrucibleSpatial.scoreTarget(high, attacker, action, cs, map, { aiHint: 'focus' });
  assert(focusDelta > baseDelta, 'focus aiHint should widen the low-vs-high gap');
});

group('provokesOoAOnPath');

group('generatePlacements (scenario setups)');
function lcg(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function openMap(w, h) { return { width:w, height:h, terrain: Array.from({length:h}, () => new Array(w).fill(null)) }; }
function partyTokens(nPc, nMon, monSize) {
  const t = [];
  for (let i = 0; i < nPc; i++) t.push({ id:'pc:' + i, side:'pc', sizeCells:1 });
  for (let i = 0; i < nMon; i++) t.push({ id:'m:' + i, side:'monster', sizeCells: monSize || 1 });
  return t;
}
function checkPlacedSane(placed, tokens, map) {
  assertEq(placed.length, tokens.length);
  const cells = new Set();
  for (const p of placed) {
    const tok = tokens.find(t => t.id === p.id);
    const n = tok.sizeCells || 1;
    for (let dy = 0; dy < n; dy++) {
      for (let dx = 0; dx < n; dx++) {
        const key = (p.x+dx) + ',' + (p.y+dy);
        assert(p.x+dx >= 0 && p.y+dy >= 0 && p.x+dx < map.width && p.y+dy < map.height, 'in bounds: ' + key);
        assert(!cells.has(key), 'no footprint overlap at ' + key);
        assert(!CrucibleSpatial.isWall(map, p.x+dx, p.y+dy), 'not on a wall: ' + key);
        cells.add(key);
      }
    }
  }
}
function centroid(placed, ids) {
  const pts = placed.filter(p => ids.includes(p.id));
  return { x: pts.reduce((s,p)=>s+p.x,0)/pts.length, y: pts.reduce((s,p)=>s+p.y,0)/pts.length };
}
test('generatePlacements: straight-on → opposing bands', () => {
  const map = openMap(20, 20), tokens = partyTokens(4, 4);
  const placed = CrucibleSpatial.generatePlacements('straight-on', tokens, map, lcg(1));
  checkPlacedSane(placed, tokens, map);
  const pcC = centroid(placed, ['pc:0','pc:1','pc:2','pc:3']);
  const moC = centroid(placed, ['m:0','m:1','m:2','m:3']);
  assert(pcC.x < 5, 'PCs on the left band, got x̄=' + pcC.x);
  assert(moC.x > 14, 'monsters on the right band, got x̄=' + moC.x);
});
test('generatePlacements: ambush → monsters close to the PC cluster', () => {
  const map = openMap(20, 20), tokens = partyTokens(4, 5);
  const placed = CrucibleSpatial.generatePlacements('ambush', tokens, map, lcg(7));
  checkPlacedSane(placed, tokens, map);
  const pcC = centroid(placed, ['pc:0','pc:1','pc:2','pc:3']);
  for (const p of placed.filter(x => x.id.startsWith('m:'))) {
    const d = Math.max(Math.abs(p.x - pcC.x), Math.abs(p.y - pcC.y));
    assert(d <= 7, 'ambusher within striking distance, got ' + d);
  }
});
test('generatePlacements: surrounded → monsters on ≥3 sides of the PCs', () => {
  const map = openMap(20, 20), tokens = partyTokens(4, 6);
  const placed = CrucibleSpatial.generatePlacements('surrounded', tokens, map, lcg(3));
  checkPlacedSane(placed, tokens, map);
  const pcC = centroid(placed, ['pc:0','pc:1','pc:2','pc:3']);
  const quads = new Set();
  for (const p of placed.filter(x => x.id.startsWith('m:'))) {
    quads.add((p.x >= pcC.x ? 'E' : 'W') + (p.y >= pcC.y ? 'S' : 'N'));
  }
  assert(quads.size >= 3, 'monsters spread around, got quadrants: ' + [...quads].join(','));
});
test('generatePlacements: flanked → two monster groups on opposite sides', () => {
  const map = openMap(20, 20), tokens = partyTokens(3, 6);
  const placed = CrucibleSpatial.generatePlacements('flanked', tokens, map, lcg(9));
  checkPlacedSane(placed, tokens, map);
  const mons = placed.filter(x => x.id.startsWith('m:'));
  const nearLowX = mons.filter(p => p.x <= 4).length, nearHighX = mons.filter(p => p.x >= 15).length;
  const nearLowY = mons.filter(p => p.y <= 4).length, nearHighY = mons.filter(p => p.y >= 15).length;
  const pincerX = nearLowX >= 2 && nearHighX >= 2;
  const pincerY = nearLowY >= 2 && nearHighY >= 2;
  assert(pincerX || pincerY, 'two opposing groups (x: ' + nearLowX + '/' + nearHighX + ', y: ' + nearLowY + '/' + nearHighY + ')');
});
test('generatePlacements: scattered → everyone placed, no overlaps', () => {
  const map = openMap(15, 15), tokens = partyTokens(4, 6);
  checkPlacedSane(CrucibleSpatial.generatePlacements('scattered', tokens, map, lcg(11)), tokens, map);
});
test('generatePlacements: walls are avoided (ring-search fallback)', () => {
  const map = openMap(20, 20);

  const tokens = partyTokens(3, 4);

group('findRetreatCell (v3.4)');

test('findRetreatCell: open map, adjacent enemy → moves away, minEnemyDist increases', () => {
  const map = { width: 20, height: 20, blocked: null };
  const start = { x: 5, y: 5 };
  const enemy = { x: 6, y: 5, dead: false, downed: false };
  const r = CrucibleSpatial.findRetreatCell(start, [enemy], map, { maxSteps: 6 });
  assert(r, 'should find a retreat cell on an open map');
  assert(r.path.length > 0, 'retreat requires movement');
  // Start's min-enemy distance is 1; the chosen cell must be strictly safer.
  assert(r.minEnemyDist > 1, 'minEnemyDist should improve on the starting distance (was 1): ' + r.minEnemyDist);
  // And the retreat cell must actually be farther than start.
  assert(CrucibleSpatial.chebyshev(r.cell, enemy) > CrucibleSpatial.chebyshev(start, enemy),
         'retreat cell is farther from the enemy than the start');
});

test('findRetreatCell: requireLosTo keeps line of sight to the specified target past a wall', () => {
  const map = { width: 20, height: 20, terrain: Array.from({length: 20}, () => new Array(20).fill(null)) };
  // A short wall segment near the retreater that some retreat cells would hide behind.
  map.terrain[5][8] = { type: 'wall' };
  map.terrain[6][8] = { type: 'wall' };
  map.terrain[4][8] = { type: 'wall' };
  const start = { x: 7, y: 5 };
  const enemy = { x: 6, y: 5, dead: false, downed: false };   // the melee threat, west
  const shotTarget = { x: 12, y: 5 };                          // must keep LOS to this, east
  const r = CrucibleSpatial.findRetreatCell(start, [enemy], map,
    { maxSteps: 6, requireLosTo: shotTarget });
  assert(r, 'should find a retreat cell that still sees the shot target');
  // The chosen cell must have LOS to the shot target despite the wall.
  assertEq(CrucibleSpatial.hasLineOfSight(map, r.cell, shotTarget), true);
  assert(r.minEnemyDist > CrucibleSpatial.chebyshev(start, enemy),
         'retreat improved distance from the melee enemy');
});

test('findRetreatCell: boxed in by enemies + walls → null', () => {
  const map = { width: 9, height: 9, terrain: Array.from({length: 9}, () => new Array(9).fill(null)) };
  // Wall ring around a 3x3 pocket centered on (4,4): walls at radius 2.
  for (let d = 2; d <= 2; d++) {
    for (let x = 4 - d; x <= 4 + d; x++) { map.terrain[4 - d][x] = { type: 'wall' }; map.terrain[4 + d][x] = { type: 'wall' }; }
    for (let y = 4 - d; y <= 4 + d; y++) { map.terrain[y][4 - d] = { type: 'wall' }; map.terrain[y][4 + d] = { type: 'wall' }; }
  }
  const start = { x: 4, y: 4 };
  // Enemies fill every open neighbor so no reachable cell improves min-dist.
  const enemies = [
    { x: 3, y: 3, dead: false, downed: false }, { x: 4, y: 3, dead: false, downed: false }, { x: 5, y: 3, dead: false, downed: false },
    { x: 3, y: 4, dead: false, downed: false },                                             { x: 5, y: 4, dead: false, downed: false },
    { x: 3, y: 5, dead: false, downed: false }, { x: 4, y: 5, dead: false, downed: false }, { x: 5, y: 5, dead: false, downed: false },
  ];
  const occupied = new Set(enemies.map(e => e.x + ',' + e.y));
  const r = CrucibleSpatial.findRetreatCell(start, enemies, map, { maxSteps: 6, occupied });
  assertEq(r, null);  // nowhere to go, and nowhere would be safer anyway
});

test('findRetreatCell: occupied cells are excluded from candidates', () => {
  const map = { width: 20, height: 20, blocked: null };
  const start = { x: 5, y: 5 };
  const enemy = { x: 6, y: 5, dead: false, downed: false };
  // Occupy a broad wall of cells to the west so the flood must route around them.
  const occupied = new Set();
  for (let y = 0; y < 20; y++) occupied.add('3,' + y);
  const r = CrucibleSpatial.findRetreatCell(start, [enemy], map, { maxSteps: 6, occupied });
  assert(r, 'should still find a retreat cell routing around occupied cells');
  // The chosen retreat cell must not be an occupied cell, nor any path step.
  assert(!occupied.has(r.cell.x + ',' + r.cell.y), 'retreat cell must not be occupied');
  for (const step of r.path) assert(!occupied.has(step.x + ',' + step.y), 'no path step may enter an occupied cell');
});

test('findPath: a 2×2 mover cannot squeeze a 1-cell gap in a wall', () => {
  // Vertical wall at x=4 with a single open cell at (4,5). A 1×1 mover slips
  // through; a 2×2 mover needs two vertically-adjacent open cells and cannot.
  const blocked = [];
  for (let y = 0; y < 10; y++) if (y !== 5) blocked.push([4, y]);
  const map = mkMap(10, 10, blocked);
  const start = { x:1, y:5 }, goal = { x:8, y:5 };
  const small = CrucibleSpatial.findPath(start, goal, map, { sizeCells:1 });
  assert(small.length > 0, '1×1 mover should find a path through the gap');
  const large = CrucibleSpatial.findPath(start, goal, map, { sizeCells:2 });
  assertEq(large.length, 0, '2×2 mover cannot pass a 1-cell gap');
});

test('findPath: 2×2 footprint occupancy blocks a route another combatant clears', () => {
  // A 2×2 mover from (0,0) to (7,0); occupy a 2-tall column at x=3 (y=0..1) and
  // walls fill the rest of that column so the 2×2 mover has no clearance.
  const blocked = [];
  for (let y = 2; y < 8; y++) blocked.push([3, y]);
  const map = mkMap(8, 8, blocked);
  const occupied = new Set(['3,0','3,1']);
  const large = CrucibleSpatial.findPath({x:0,y:0}, {x:6,y:0}, map, { sizeCells:2, occupied });
  assertEq(large.length, 0, 'no 2×2-clear route past the occupied+walled column');
});

test('placeCombatants: large footprints do not overlap at spawn', () => {
  const map = { width: 20, height: 20, blocked: null };
  const combatants = [
    { id:'a', side:'monster', sizeCells:2 },
    { id:'b', side:'monster', sizeCells:2 },
    { id:'c', side:'monster', sizeCells:3 },
    { id:'d', side:'pc', sizeCells:1 },
    { id:'e', side:'pc', sizeCells:1 },
  ];
  CrucibleSpatial.placeCombatants(combatants, map);
  const claimed = new Set();
  for (const c of combatants) {
    for (const cell of CrucibleSpatial.footprintCells(c)) {
      const k = cell.x + ',' + cell.y;
      assert(!claimed.has(k), `footprint overlap at ${k} for ${c.id}`);
      assert(cell.x >= 0 && cell.x < map.width && cell.y >= 0 && cell.y < map.height,
        `footprint cell ${k} out of bounds for ${c.id}`);
      claimed.add(k);
    }
  }
});

test('canAttackFrom: uses footprint edge distance for a Large attacker', () => {
  const map = { width: 20, height: 20, blocked: null };
  const large = { x:0, y:0, sizeCells:2 };            // reach-1 melee occupies x[0,1]
  const meleeAction = { actionRange:'melee', reach:5 };
  // Medium at (2,0) is edge-adjacent to the Large → in melee reach.
  assert(CrucibleSpatial.canAttackFrom(large, { x:2, y:0, sizeCells:1 }, meleeAction, map),
    'Large should reach an edge-adjacent Medium');
  // Medium at (3,0) is 2 away → out of reach 1.
  assert(!CrucibleSpatial.canAttackFrom(large, { x:3, y:0, sizeCells:1 }, meleeAction, map),
    'Large should NOT reach a Medium two cells off its edge');
});
