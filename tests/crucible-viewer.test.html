<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>crucible-viewer tests</title>
<style>
  body { font-family: monospace; background: #0e1418; color: #dde7e9; padding: 1rem; }
  .pass { color: #6dd58c; } .fail { color: #d97a7a; }
  button { padding: 0.5rem 1rem; background: #1d3a4a; color: #dde7e9; border: 1px solid #1c2429; cursor: pointer; }
  pre { white-space: pre-wrap; margin-top: 0.5rem; }
  #host { display: none; }
  .tactical-board .terrain-wall { fill: #4a4a52; }
  .tactical-board .terrain-difficult { fill: #806c3a; opacity: 0.4; }
  .tactical-board .terrain-damaging rect { fill: #c43838; opacity: 0.35; }
  .tactical-board .terrain-damaging text { fill: #ffdd99; font-family: Cinzel, serif; font-size: 0.55rem; pointer-events: none; }
</style>
</head>
<body>
<h1>crucible-viewer tests</h1>
<button onclick="runAll()">Run tests</button>
<pre id="out"></pre>
<div id="host"></div>
<script src="../crucible-spatial.js"></script>
<script src="../crucible-viewer.js"></script>
<script>
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertEq(a, b, m) {
  const x = JSON.stringify(a), y = JSON.stringify(b);
  if (x !== y) throw new Error((m || 'mismatch') + ': ' + x + ' vs ' + y);
}
function runAll() {
  const out = document.getElementById('out');
  let passed = 0, failed = 0;
  const lines = [];
  for (const t of TESTS) {
    try { t.fn(); lines.push('<span class="pass">✓ ' + t.name + '</span>'); passed++; }
    catch (e) { lines.push('<span class="fail">✗ ' + t.name + ' — ' + e.message + '</span>'); failed++; }
  }
  lines.push('\n' + passed + ' passed, ' + failed + ' failed');
  out.innerHTML = lines.join('\n');
}
function syntheticTrial() {
  return {
    events: [
      { type: 'placement', round: 0, map: { width: 10, height: 10, blocked: null },
        placements: [
          { id: 'pc:1', name: 'PC', side: 'pc', pos: { x: 1, y: 1 }, hp: 30, maxHp: 30, ac: 14, speed: 6 },
          { id: 'mon:0', name: 'Goblin', side: 'monster', pos: { x: 8, y: 8 }, hp: 7, maxHp: 7, ac: 13, speed: 6 },
        ] },
      { type: 'move', round: 1, who: 'pc:1', name: 'PC', from: { x: 1, y: 1 }, to: { x: 4, y: 4 },
        path: [{x:2,y:2},{x:3,y:3},{x:4,y:4}], reason: 'engage' },
      { type: 'attack', round: 1, actor: 'PC', target: 'Goblin', action: 'Sword', roll: 17, hit: true, damageDealt: 8,
        pos: { x: 4, y: 4 }, targetPos: { x: 8, y: 8 } },
      { type: 'damage', round: 1, actor: 'PC', target: 'Goblin', amount: 8, dmgType: 'slashing', action: 'Sword',
        pos: { x: 4, y: 4 }, targetPos: { x: 8, y: 8 } },
    ],
    rounds: 1, winner: 'pc', partyView: [{ name: 'PC', hp: 30 }],
  };
}
// === Tests below this line ===
test('initialState: extracts combatants + map from placement event', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  assertEq(state.map, { width: 10, height: 10, blocked: null });
  assertEq(state.combatants.length, 2);
  const pc = state.combatants.find(c => c.id === 'pc:1');
  assertEq(pc.x, 1);
  assertEq(pc.y, 1);
  assertEq(pc.hp, 30);
});

test('applyEvent: move updates combatant position', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, trial.events[1]);
  const pc = state.combatants.find(c => c.id === 'pc:1');
  assertEq(pc.x, 4);
  assertEq(pc.y, 4);
});

test('applyEvent: damage event reduces target hp', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, { type: 'damage', target: 'Goblin', amount: 5 });
  const mon = state.combatants.find(c => c.name === 'Goblin');
  assertEq(mon.hp, 2);
});

test('applyEvent: damage to 0 marks dead (monster) / downed (pc)', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, { type: 'damage', target: 'Goblin', amount: 99 });
  const mon = state.combatants.find(c => c.name === 'Goblin');
  assertEq(mon.hp, 0);
  assert(mon.dead);
});

test('applyEvent: aoe event records lastAoE', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, {
    type: 'aoe', shape: 'sphere', center: { x: 5, y: 5 }, size: 2,
    cellsCovered: [{x:4,y:4},{x:5,y:5},{x:6,y:6}], targets: [],
  });
  assert(state.lastAoE);
  assertEq(state.lastAoE.shape, 'sphere');
});

test('renderSVG: produces an svg with W*CELL × H*CELL viewBox and one token per combatant', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  const host = document.getElementById('host');
  host.innerHTML = '';
  CrucibleViewer.renderSVG(host, state);
  const svg = host.querySelector('svg');
  assert(svg, 'svg present');
  assert(svg.getAttribute('viewBox').includes('240 240'));  // 10×24 = 240
  const tokens = svg.querySelectorAll('.token');
  assertEq(tokens.length, 2);
});

test('mount: renders viewer with controls, cursor starts at 0', () => {
  const host = document.getElementById('host');
  host.innerHTML = '';
  const trial = syntheticTrial();
  const v = CrucibleViewer.mount(host, trial);
  assertEq(v.cursor, 0);
  assert(host.querySelector('.viewer-controls'), 'controls rendered');
  assert(host.querySelector('svg.tactical-board'), 'board rendered');
});

test('mount + stepForward: advances cursor and re-renders', () => {
  const host = document.getElementById('host');
  host.innerHTML = '';
  const trial = syntheticTrial();
  const v = CrucibleViewer.mount(host, trial);
  v.stepForward();
  assertEq(v.cursor, 1);
  const pcToken = host.querySelector('[data-id="pc:1"]');
  assert(pcToken.getAttribute('transform').includes('translate'));
});

test('mount + stepBack from cursor=2 returns to cursor=1', () => {
  const host = document.getElementById('host');
  host.innerHTML = '';
  const trial = syntheticTrial();
  const v = CrucibleViewer.mount(host, trial);
  v.stepForward(); v.stepForward();
  assertEq(v.cursor, 2);
  v.stepBack();
  assertEq(v.cursor, 1);
});

test('renderSVG: draws a move-trail polyline when state.lastMove is set', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, trial.events[1]);  // move event
  const host = document.getElementById('host');
  host.innerHTML = '';
  CrucibleViewer.renderSVG(host, state);
  const trail = host.querySelector('.move-trail');
  assert(trail, 'move trail polyline rendered');
});

test('renderSVG: draws wall + difficult + damaging cells from map.terrain', () => {
  const trial = { events: [{
    type: 'placement', round: 0,
    map: { width: 5, height: 5, blocked: null, terrain: [
      [null, null, null, null, null],
      [null, {type:'wall'}, null, null, null],
      [null, null, {type:'difficult'}, null, null],
      [null, null, null, {type:'damaging', dice:'1d6', mod:0, dmgType:'fire'}, null],
      [null, null, null, null, null],
    ]},
    placements: [{ id: 'pc:1', name: 'P', side: 'pc', pos:{x:0,y:0}, hp:30, maxHp:30, ac:14, speed:6 }],
  }], rounds: 0, winner: 'pc', partyView: [] };
  const host = document.getElementById('host');
  host.innerHTML = '';
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.renderSVG(host, state);
  assert(host.querySelector('.terrain-wall'), 'wall rendered');
  assert(host.querySelector('.terrain-difficult'), 'difficult rendered');
  assert(host.querySelector('.terrain-damaging'), 'damaging rendered');
});

// ═══════════════════ v3.3: standard actions ═══════════════════

test('applyEvent: shove-pushed moves the target token to its new cell', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  const before = state.combatants.find(c => c.id === 'mon:0');
  assertEq([before.x, before.y], [8, 8]);
  CrucibleViewer.applyEvent(state, {
    type: 'shove', round: 1, who: 'pc:1', name: 'PC',
    target: 'mon:0', targetName: 'Goblin', mode: 'push',
    outcome: 'pushed', to: { x: 7, y: 8 },
  });
  const after = state.combatants.find(c => c.id === 'mon:0');
  assertEq([after.x, after.y], [7, 8], 'pushed target moved to the event destination');
});

test('applyEvent: a resisted shove leaves the target token in place', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, {
    type: 'shove', round: 1, who: 'pc:1', name: 'PC',
    target: 'mon:0', targetName: 'Goblin', mode: 'push',
    outcome: 'resisted', to: null,
  });
  const mon = state.combatants.find(c => c.id === 'mon:0');
  assertEq([mon.x, mon.y], [8, 8], 'resisted shove does not move the token');
});

test('mount: replays a stream containing every new v3.3 event type without throwing', () => {
  const trial = {
    events: [
      { type: 'placement', round: 0, map: { width: 10, height: 10, blocked: null },
        placements: [
          { id: 'pc:1', name: 'PC', side: 'pc', pos: { x: 1, y: 1 }, hp: 30, maxHp: 30, ac: 14, speed: 6 },
          { id: 'pc:2', name: 'Ally', side: 'pc', pos: { x: 2, y: 1 }, hp: 30, maxHp: 30, ac: 14, speed: 6 },
          { id: 'mon:0', name: 'Goblin', side: 'monster', pos: { x: 8, y: 8 }, hp: 20, maxHp: 20, ac: 13, speed: 6 },
        ] },
      { type: 'dodge', round: 1, who: 'pc:1', name: 'PC' },
      { type: 'disengage', round: 1, who: 'pc:1', name: 'PC' },
      { type: 'help', round: 1, who: 'pc:1', name: 'PC', target: 'pc:2', targetName: 'Ally' },
      { type: 'hide', round: 1, who: 'pc:1', name: 'PC', success: true, roll: 18, dc: 11 },
      { type: 'hide', round: 1, who: 'pc:1', name: 'PC', success: false, reason: 'seen' },
      { type: 'grapple', round: 1, who: 'pc:1', name: 'PC', target: 'mon:0', targetName: 'Goblin', success: true, roll: 4, dc: 13 },
      { type: 'shove', round: 1, who: 'pc:1', name: 'PC', target: 'mon:0', targetName: 'Goblin', mode: 'push', outcome: 'pushed', to: { x: 7, y: 8 } },
      { type: 'stand-up', round: 2, who: 'mon:0', name: 'Goblin' },
      { type: 'condition-ended', round: 2, who: 'mon:0', name: 'Goblin', condition: 'grappled', reason: 'escaped', roll: 15, dc: 13 },
      { type: 'grapple-escape-failed', round: 2, who: 'mon:0', name: 'Goblin', roll: 3, dc: 13 },
    ],
    rounds: 2, winner: 'pc', partyView: [],
  };
  const host = document.getElementById('host');
  host.innerHTML = '';
  const v = CrucibleViewer.mount(host, trial);
  // Step through every event; formatEvent + applyEvent must not throw.
  for (let i = 0; i < trial.events.length; i++) v.stepForward();
  assertEq(v.cursor, trial.events.length - 1, 'stepped to the final event');
  assert(host.querySelector('svg.tactical-board'), 'board still rendered after the full stream');
});

// ═══════════════════ v3.6: status glyphs ═══════════════════

test('renderSVG: condition-applied adds a status glyph above the token', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  CrucibleViewer.applyEvent(state, {
    type: 'condition-applied', round: 1, who: 'pc:1', name: 'PC',
    target: 'mon:0', targetName: 'Goblin', condition: 'poisoned', duration: 1, dc: 12,
  });
  const mon = state.combatants.find(c => c.id === 'mon:0');
  assert(mon.conditions.has('poisoned'), 'condition tracked in viewer state');
  const host = document.getElementById('host');
  host.innerHTML = '';
  CrucibleViewer.renderSVG(host, state);
  const g = host.querySelector('[data-id="mon:0"] .status-glyphs');
  assert(g, 'status-glyphs element rendered');
  assertEq(g.textContent, 'P');   // poisoned → first letter uppercased
});

test('renderSVG: prone glyph (▼) shows then clears on stand-up', () => {
  const trial = syntheticTrial();
  const state = CrucibleViewer.initialState(trial.events[0]);
  // Knock the goblin prone via a failed shove.
  CrucibleViewer.applyEvent(state, {
    type: 'shove', round: 1, who: 'pc:1', name: 'PC',
    target: 'mon:0', targetName: 'Goblin', mode: 'prone', outcome: 'prone', to: null,
  });
  const host = document.getElementById('host');
  host.innerHTML = '';
  CrucibleViewer.renderSVG(host, state);
  let g = host.querySelector('[data-id="mon:0"] .status-glyphs');
  assert(g && g.textContent.includes('▼'), 'prone glyph rendered after shove-prone');
  // Stand up → the glyph strip disappears.
  CrucibleViewer.applyEvent(state, { type: 'stand-up', round: 2, who: 'mon:0', name: 'Goblin' });
  host.innerHTML = '';
  CrucibleViewer.renderSVG(host, state);
  g = host.querySelector('[data-id="mon:0"] .status-glyphs');
  assert(!g, 'no glyph strip after stand-up clears prone');
  const mon = state.combatants.find(c => c.id === 'mon:0');
  assert(!mon.conditions.has('prone'), 'prone cleared from state');
});
</script>
</body>
</html>
